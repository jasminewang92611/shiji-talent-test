<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>识己 · 天赋测评工具</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f7f4ee; --card-bg:#fffefb; --text:#2f332f; --text-light:#73776f;
  --wind:#7eb8da; --fire:#e8835e; --water:#6db5c4; --earth:#b8956a;
  --wind-light:#e8f4fa; --fire-light:#fdf0eb; --water-light:#eaf6f8; --earth-light:#f5efe6;
  --primary:#4f735f; --primary-dark:#365544; --primary-light:#e8f0eb; --accent:#bd8750; --accent-light:#f6eadc; --love:#c4737a;
  --radius:18px; --shadow:0 12px 34px rgba(67,78,68,.08); --shadow-soft:0 5px 18px rgba(67,78,68,.06);
  --font-head:"Noto Serif SC","Source Han Serif SC",serif;
  --font-body:"PingFang SC","Microsoft YaHei",sans-serif;
}
body{font-family:var(--font-body);background:radial-gradient(circle at 8% 0%,rgba(196,144,90,.10),transparent 26%),radial-gradient(circle at 92% 8%,rgba(90,125,106,.11),transparent 28%),var(--bg);color:var(--text);line-height:1.7;min-height:100vh}
.app{max-width:960px;margin:0 auto;padding:20px}
.header{text-align:center;padding:46px 20px 32px;position:relative}
.header::before{content:'';display:block;width:48px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--primary),var(--accent));margin:0 auto 14px}
.header h1{font-family:var(--font-head);font-size:2.08rem;color:var(--primary-dark);font-weight:650;letter-spacing:3px;text-shadow:0 1px 0 #fff}
.header .sub{color:var(--text-light);font-size:.9rem;margin-top:6px;letter-spacing:1px}
/* Input */
.input-panel{background:rgba(255,254,251,.96);border-radius:22px;padding:30px 34px;box-shadow:var(--shadow);margin-bottom:26px;border:1px solid rgba(198,185,168,.42);position:relative;overflow:hidden}
.input-panel::before{content:'';position:absolute;left:0;top:0;width:100%;height:4px;background:linear-gradient(90deg,var(--primary),#82a08d 55%,var(--accent))}
.input-panel h2{font-family:var(--font-head);font-size:1.1rem;color:var(--primary);margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid #eee}
.input-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.input-group{flex:1;min-width:180px}
.input-group label{display:block;font-size:.82rem;color:var(--text-light);margin-bottom:4px;font-weight:500}
.input-group input,.input-group textarea,.input-group select{width:100%;padding:11px 14px;border:1px solid #ded9d0;border-radius:11px;font-size:.9rem;font-family:var(--font-body);background:#fffefa;transition:all .2s;color:var(--text)}
.input-group input:focus,.input-group textarea:focus,.input-group select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.input-group textarea{resize:vertical;min-height:72px}
.input-group .hint{font-size:.75rem;color:#aaa;margin-top:4px}
.auto-years{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:14px 17px;background:linear-gradient(135deg,#edf4ef,#f7f2ea);border-radius:12px;font-size:.82rem;border:1px solid #dce7df}
.auto-years strong{color:var(--primary)}
.auto-years .yr-badge{display:inline-block;padding:4px 14px;border-radius:20px;font-size:.78rem;font-weight:700}
.yr-expand{background:#fdf0eb;color:#c06040}
.yr-settle{background:#eaf1ed;color:var(--primary)}
.btn-row{display:flex;gap:12px;justify-content:center;margin-top:8px}
.btn{padding:12px 28px;border:none;border-radius:13px;font-size:.92rem;cursor:pointer;font-family:var(--font-body);font-weight:600;transition:all .25s;letter-spacing:.5px;box-shadow:0 3px 10px rgba(65,78,68,.06)}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff}
.btn-primary:hover{background:#4a6b58;transform:translateY(-1px);box-shadow:0 4px 12px rgba(90,125,106,.3)}
.btn-outline{background:#fffefb;color:var(--primary);border:1px solid #91aa9a}
.btn-outline:hover{background:var(--primary-light)}
.btn-export{background:linear-gradient(135deg,#c79561,#ad7440);color:#fff}
.btn-export:hover{background:#b07e4a}
.btn-small{padding:9px 22px;font-size:.84rem}
.talent-builder{display:grid;gap:14px}
.builder-step{padding:17px 18px;background:linear-gradient(145deg,#fffefa,#fbfaf6);border:1px solid #ebe4da;border-radius:14px;box-shadow:0 2px 8px rgba(74,81,73,.03)}
.builder-step-title{display:flex;align-items:center;gap:8px;color:var(--primary);font-size:.9rem;font-weight:700;margin-bottom:10px}
.step-no{width:25px;height:25px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;background:linear-gradient(135deg,var(--primary),#779585);color:#fff;font-size:.72rem;box-shadow:0 3px 8px rgba(79,115,95,.18)}
.builder-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.select-row{display:grid;grid-template-columns:minmax(0,1fr) 105px 38px;gap:8px;margin-top:8px;align-items:center}
.select-row.potential-row{grid-template-columns:minmax(0,1fr) 38px}
.icon-btn{width:38px;height:38px;border:1px solid #ded8cf;border-radius:9px;background:#fff;color:#8a7662;cursor:pointer;font-size:1rem}
.icon-btn:hover{background:#fff5ee;color:var(--accent)}
.add-row-btn{margin-top:10px;border:1px dashed #b8cbbf;border-radius:9px;background:#f4f8f5;color:var(--primary);padding:8px 13px;cursor:pointer;font-family:var(--font-body)}
.builder-summary{padding:13px 15px;background:linear-gradient(135deg,var(--primary-light),#f7f1e8);border-radius:11px;color:var(--primary-dark);font-size:.8rem;line-height:1.8;border-left:4px solid var(--primary)}
.field-note{font-size:.74rem;color:#999;margin-top:5px}
/* Tabs */
.tabs{display:flex;gap:6px;background:rgba(255,254,251,.94);border-radius:15px;box-shadow:var(--shadow-soft);overflow:hidden;margin-bottom:24px;padding:6px;border:1px solid rgba(198,185,168,.34)}
.tab{flex:1;padding:13px 6px;text-align:center;cursor:pointer;font-size:.82rem;font-weight:500;color:var(--text-light);border:none;background:transparent;font-family:var(--font-body);transition:all .2s;position:relative}
.tab:hover{color:var(--primary);background:#fafcfb}
.tab.active{color:var(--primary-dark);font-weight:700;background:linear-gradient(135deg,var(--primary-light),#f3eee6);border-radius:10px}
.tab.active::after{content:'';position:absolute;bottom:0;left:20%;width:60%;height:3px;background:var(--primary);border-radius:3px 3px 0 0}
/* Cards */
.card{background:rgba(255,254,251,.98);border-radius:20px;box-shadow:var(--shadow);padding:34px;margin-bottom:22px;border:1px solid rgba(198,185,168,.35)}
.card-header{display:flex;align-items:center;gap:14px;margin-bottom:24px;padding-bottom:16px;border-bottom:2px solid var(--primary-light)}
.card-icon{width:50px;height:50px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:1.45rem;box-shadow:inset 0 0 0 1px rgba(90,125,106,.10)}
.card-title{font-family:var(--font-head);font-size:1.3rem;color:var(--primary)}
.card-client{font-size:.85rem;color:var(--text-light)}
/* Energy */
.energy-section{margin-bottom:28px}
.energy-section h3{font-size:1rem;color:var(--primary);margin-bottom:16px;font-family:var(--font-head)}
.energy-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.energy-item{background:linear-gradient(145deg,#fff,#fbfaf7);border-radius:14px;padding:17px;border:1px solid #eee9e1;box-shadow:0 3px 12px rgba(70,78,71,.04)}
.energy-item .energy-label{font-size:.8rem;color:var(--text-light);margin-bottom:4px}
.energy-item .energy-name{font-size:1.05rem;font-weight:700;margin-bottom:8px}
.energy-item .energy-bar-wrap{height:8px;background:#f0ece6;border-radius:4px;overflow:hidden;margin-bottom:6px}
.energy-item .energy-bar{height:100%;border-radius:4px;transition:width .6s ease}
.energy-item .energy-count{font-size:.8rem;color:var(--text-light)}
.energy-item.zero{background:#fff9f5;border-color:#fce4d0}
.energy-zero-alert{background:#fff5ee;border:1.5px solid #f0c8a0;border-radius:12px;padding:16px 20px;margin:16px 0;font-size:.88rem;color:#b07040}
.energy-zero-alert strong{color:#c06030}
.wind-bar{background:var(--wind)} .fire-bar{background:var(--fire)}
.water-bar{background:var(--water)} .earth-bar{background:var(--earth)}
/* Ranking */
.ranking-section{margin-bottom:28px}
.ranking-section h3{font-size:1rem;color:var(--primary);margin-bottom:16px;font-family:var(--font-head)}
.ranking-list{list-style:none}
.ranking-item{display:flex;align-items:center;gap:12px;padding:11px 16px;margin-bottom:8px;background:#fdfdfc;border-radius:11px;border-left:4px solid transparent;box-shadow:0 2px 7px rgba(70,78,71,.025)}
.ranking-item.r1{border-left-color:var(--primary);background:var(--primary-light)}
.ranking-item.r2{border-left-color:var(--accent);background:#fdf8f3}
.ranking-item.r3{border-left-color:var(--wind)}
.ranking-item .rank-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;color:#fff;flex-shrink:0}
.ranking-item.r1 .rank-num{background:var(--primary)}
.ranking-item.r2 .rank-num{background:var(--accent)}
.ranking-item.r3 .rank-num{background:var(--wind)}
.ranking-item .rank-label{font-size:.85rem;font-weight:500}
.ranking-item .rank-detail{font-size:.78rem;color:var(--text-light);margin-left:auto}
/* Talent Detail */
.talent-detail{margin-bottom:20px}
.talent-detail h4{font-size:.95rem;color:#555;margin-bottom:8px}
.talent-detail p{font-size:.87rem;color:var(--text);margin-bottom:6px;line-height:1.8}
.talent-detail .tag{display:inline-block;padding:3px 12px;border-radius:20px;font-size:.75rem;margin:3px 5px 3px 0}
.tag-wind{background:var(--wind-light);color:#4a8aaa}
.tag-fire{background:var(--fire-light);color:#c06040}
.tag-water{background:var(--water-light);color:#3d8a94}
.tag-earth{background:var(--earth-light);color:#8a6a40}
/* Career */
.career-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.career-tag{padding:8px 18px;background:var(--primary-light);color:var(--primary);border-radius:24px;font-size:.82rem;font-weight:500;border:1px solid #d0e0d5}
/* Annual */
.annual-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.annual-card{background:#fdfdfc;border-radius:12px;padding:20px;border:1px solid #f0ece6}
.annual-card .year-tag{display:inline-block;padding:4px 14px;border-radius:20px;font-size:.78rem;font-weight:700;margin-bottom:12px}
.tag-expand{background:#fdf0eb;color:#c06040}
.tag-settle{background:#eaf1ed;color:var(--primary)}
.annual-card h4{font-size:.95rem;margin-bottom:10px;font-family:var(--font-head)}
.annual-card ul{margin:0;padding-left:18px}
.annual-card li{font-size:.82rem;color:var(--text);margin-bottom:6px;line-height:1.7}
/* Synastry */
.match-level{text-align:center;padding:20px;margin:16px 0;border-radius:12px}
.match-high{background:#eaf1ed;color:var(--primary);font-size:1.1rem;font-weight:700}
.match-mid{background:#fdf8f3;color:var(--accent);font-size:1rem;font-weight:600}
.match-note{background:#fafafa;color:var(--text-light);font-size:.9rem}
.synastry-actions{display:flex;justify-content:flex-end;margin-top:4px}
.report-cover{padding:26px 0 20px;text-align:center;border-bottom:2px solid var(--primary-light);margin-bottom:20px}
.report-cover h2{font-family:var(--font-head);color:var(--primary);font-size:1.55rem}
.report-cover p{font-size:.82rem;color:var(--text-light);margin-top:4px}
.disclaimer{margin-top:18px;padding:12px 16px;background:#fafafa;border-radius:9px;color:#888;font-size:.76rem;line-height:1.7;text-align:center}
.talent-detail>h3,.ranking-section>h3,.energy-section>h3{display:flex;align-items:center;gap:9px;color:var(--primary-dark)}
.talent-detail>h3::before,.ranking-section>h3::before,.energy-section>h3::before{content:'';width:5px;height:18px;border-radius:4px;background:var(--accent);flex:0 0 auto}
.career-tag{box-shadow:0 2px 7px rgba(79,115,95,.06)}
.annual-card{box-shadow:0 4px 14px rgba(67,78,68,.045)}
.placeholder-banner{background:rgba(255,254,251,.72)!important;border-color:#d8d1c7!important}
@media(hover:hover){
  .btn:hover{transform:translateY(-1px);box-shadow:0 7px 16px rgba(65,78,68,.12)}
  .builder-step:hover{border-color:#d9e2dc;box-shadow:0 5px 14px rgba(74,81,73,.05)}
  .tab:hover{border-radius:10px}
  .energy-item:hover{transform:translateY(-1px);box-shadow:0 7px 16px rgba(70,78,71,.07)}
}
/* Print */
@media print{
  body{background:#fff}
  .input-panel,.tabs,.btn-row{display:none!important}
  .card{box-shadow:none;break-inside:avoid;page-break-inside:avoid;margin-bottom:16px;padding:20px 0}
  .app{max-width:100%;padding:0}
  .annual-grid{grid-template-columns:1fr 1fr 1fr}
  .report-cover{display:block}
  .disclaimer{break-inside:avoid}
}
@media(max-width:600px){
  .app{padding:12px}
  .header h1{font-size:1.5rem}
  .input-panel{padding:20px 16px}
  .tabs{flex-wrap:wrap}
  .tab{flex:1 1 33%;padding:10px 4px;font-size:.75rem}
  .card{padding:20px 16px}
  .annual-grid{grid-template-columns:1fr}
  .builder-grid{grid-template-columns:1fr}
  .select-row{grid-template-columns:minmax(0,1fr) 85px 36px}
  .btn-row{flex-direction:column}
  .btn{width:100%}
}
.placeholder-banner{background:#fafafa;border:2px dashed #e0dcd5;border-radius:var(--radius);padding:40px;text-align:center;color:#aaa}
.placeholder-banner p{font-size:.9rem}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>识己天赋测试</h1>
    <div class="sub">用天赋的语言，读懂生命的剧本</div>
  </div>

  <div class="input-panel" id="inputPanel">
    <h2>客户信息</h2>
    <div class="input-row">
      <div class="input-group"><label>客户姓名</label><input type="text" id="clientName" placeholder="例如：静静"></div>
      <div class="input-group"><label>阳历出生日期</label><input type="date" id="birthDate" onchange="updateAutoYears()"></div>
    </div>
    <div class="input-row"><div class="input-group" style="flex:2"><label>天赋信息</label><div id="clientTalentForm"></div></div></div>
    <div class="input-row">
      <div class="auto-years" id="autoYearsDisplay">
        <strong>📅 三年年度策略：</strong>
        <span style="color:var(--text-light);font-size:.8rem">请先选择出生日期，自动计算</span>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="runAnalysis()">开始解读</button>
      <button class="btn btn-outline" onclick="loadExample()">加载示例</button>
      <button class="btn btn-outline" onclick="exportCareerImage()">导出职业卡片图片</button>
      <button class="btn btn-export" onclick="exportPDF()">导出详细PDF</button>
    </div>

    <!-- 合盘区域 -->
    <h2 style="margin-top:24px;cursor:pointer;color:var(--primary)" onclick="toggleSynastry()">合盘分析 ▸ 点击展开</h2>
    <div id="synastryPanel" style="display:none">
    <div class="input-row">
      <div class="input-group"><label>对方姓名</label><input type="text" id="partnerName" placeholder="例如：小明"></div>
      <div class="input-group"><label>对方阳历出生日期</label><input type="date" id="partnerBirth"></div>
    </div>
    <div class="input-row"><div class="input-group" style="flex:2"><label>对方天赋信息</label><div id="partnerTalentForm"></div></div></div>
    <div class="synastry-actions"><button class="btn btn-outline btn-small" onclick="runSynastry()">单独生成合盘</button></div>
    </div>
  </div>

  <div class="tabs" id="tabNav">
    <button class="tab active" onclick="switchTab('career')">天赋职业</button>
    <button class="tab" onclick="switchTab('annual')">年度策略</button>
    <button class="tab" onclick="switchTab('relations')">关系综合</button>
  </div>

  <div id="results"></div>
</div>

<script>
// ==================== 数据 ====================
const TALENT_NAMES={0:'创意天赋',1:'整合天赋',2:'敏锐天赋',3:'美育天赋',4:'挑战天赋',5:'价值天赋',6:'面相天赋',7:'家庭天赋',8:'教练天赋',9:'穿透天赋',10:'显化天赋',11:'悟性天赋',12:'趋势天赋',13:'执着天赋',14:'涉外天赋',15:'策略天赋',16:'执行天赋',17:'洞察天赋',18:'感知天赋',19:'资源天赋',20:'计划天赋',21:'传统天赋'};

const ENERGY_TYPES={
  wind:{name:'认知能量',symbol:'风',color:'#7eb8da',light:'#e8f4fa',desc:'具备快速、多元的学习能力，擅长将知识转化为可变现的输出。思维灵活，表达逻辑清晰，天然适合知识型、顾问型工作。核心驱动力在于「学习—整合—输出」的循环。',nums:[0,1,6,11,17,20],zeroMsg:'您拥有广阔的思维空间，适合发展独特的认知风格。建议多肯定自己的贡献与价值，寻找欣赏您独特视角的导师或搭档，让思想的火花更有信心地绽放。'},
  fire:{name:'行动能量',symbol:'火',color:'#e8835e',light:'#fdf0eb',desc:'充满干劲，企图心强，直觉决断，适合竞争性、目标导向的工作环境。是天生的行动者，属于「竞争型人才」，最适合能够自主发挥的岗位。',nums:[4,8,14,16,19],zeroMsg:'您的行动节奏偏从容优雅，更适合深思熟虑后的精准出击。建议与行动力强的伙伴搭档，借助外部目标和协作关系，优雅地激活内在的行动潜能。'},
  water:{name:'情绪能量',symbol:'水',color:'#6db5c4',light:'#eaf6f8',desc:'以人为本，同理心强，情感连接能力卓越。擅长销售、活动、策划等需要「以情动人」的工作，属于「渗透型人才」，善于在无形中建立信任与影响力。',nums:[2,3,7,12,13,18],zeroMsg:'您的情绪感知灵敏而内敛，以理性思考见长。建议多与情感表达能力出色的伙伴交流，在合作中自然补充情感沟通的维度，让理性与感性相得益彰。'},
  earth:{name:'构建能量',symbol:'土',color:'#b8956a',light:'#f5efe6',desc:'擅长结构性思考，做事有计划且落地，善于提供解决方案。注重实效、讲究细节，金钱能量强，是组织和团队中的「落实型人才」。',nums:[5,9,10,15,21],zeroMsg:'您拥有开放灵动的思维特质，创意和灵感是其天然优势。建议搭配结构化工具辅助执行落地，或与擅长构建的伙伴协作，让灵感找到扎根的土壤。'}
};

const TALENT_DETAIL={
  0:{name:'创意天赋',energy:'wind',core:'极具创意与灵感，想象力超群，思维跳脱常规，敢于从零开始打造全新方案。具备天然的领导者气质，勇于挑战既有框架。',careers:['广告创意','品牌策划','AI产品设计','公关传播','编剧导演','初创企业创始人','内容创作','创业顾问'],path:'必须将创意落地为具体作品，广泛学习跨领域知识，建立持续输出机制。持续将灵感通过项目经历转化为可见价值，让创意成为可交付的现实。'},
  1:{name:'整合天赋',energy:'wind',core:'学习速度极快，善于将不同领域的知识整合并升华成更优的版本。文字表达能力出色，逻辑清晰，是天然的知识传播者与策略沟通者。',careers:['知识付费讲师','商业撰稿','策略顾问','培训师','商业谈判专家','课程研发','内容总监'],path:'持续文字输出与教学，积累作品集。以教促学，加速知识的内化与变现。需要注意保持学习的深度沉淀，确保输入与输出的良性循环。'},

function getStructuredDraft(prefix){
  const mainRows=[...document.querySelectorAll(`#${prefix}MainRows .main-row`)];

  const aux=document.getElementById(prefix+'Aux')?.value||'';

  const resonanceMode=document.getElementById(prefix+'ResonanceMode')?.value||'no';
  const resonanceTalent=document.getElementById(prefix+'ResonanceTalent')?.value||'';

  el.textContent=`已选主天赋 ${d.mains.length}/5—7 · 辅助天赋 ${d.aux===''?'未选':'已选'} · 潜能天赋 ${d.potentials.length}/1—2 · 组合天赋：${comboName}`;
}

function collectStructuredTalent(prefix,showAlert=true){
  const d=getStructuredDraft(prefix);
  const fail=msg=>{if(showAlert) alert(msg);return null;};
  if(d.mains.length<5||d.mains.length>7) return fail('请选择5—7个主天赋');
  const mainNums=d.mains.map(x=>Number(x.num));
  if(new Set(mainNums).size!==mainNums.length) return fail('主天赋不能重复，请检查选择');
  if(d.aux==='') return fail('请选择1个辅助天赋');
  if(d.potentials.length<1||d.potentials.length>2) return fail('请选择1—2个潜能天赋');
  if(new Set(d.potentials).size!==d.potentials.length) return fail('潜能天赋不能重复，请检查选择');
  const auxNum=Number(d.aux);
  const auxMatchesMain=mainNums.includes(auxNum);
  if(d.resonanceMode==='yes'){
    if(d.resonanceTalent==='') return fail('请选择最强共振天赋');
    if(Number(d.resonanceTalent)!==auxNum||!mainNums.includes(Number(d.resonanceTalent))) return fail('最强共振天赋必须同时出现在主天赋与辅助天赋中');
  }else if(auxMatchesMain){
    return fail('检测到主天赋与辅助天赋相同，请将“最强共振天赋”选择为“有”');
  }
  let combos=[];
  if(d.combo!==''){
    const combo=COMBOS[Number(d.combo)];
    if(!combo) return fail('组合天赋选择无效，请重新选择');
    const owned=new Set([...mainNums,auxNum]);
    if(!combo.nums.every(num=>owned.has(num))) return fail(`所选组合需要同时具备：${combo.nums.map(n=>TALENT_NAMES[n]).join('、')}`);
    combos=[combo];
  }
  const talents=d.mains.map(x=>({num:Number(x.num),name:TALENT_NAMES[Number(x.num)],multiplier:x.multiplier,role:'main',source:'select'}));
  talents.push({num:auxNum,name:TALENT_NAMES[auxNum],multiplier:1,role:'aux',source:'select'});
  return {talents,potentialNums:d.potentials.map(Number),combos};
}

// 年度策略自动计算
function calcAnnualYear(year,month,day){
  const total=Number(year)+Number(month)+Number(day);
  const digitSum=n=>String(Math.abs(n)).split('').reduce((a,b)=>a+Number(b),0);
  const first=digitSum(total);
  // 正常年度会直接落在 5-17；极远年份以 13 个策略位循环兜底。
  return first>=5&&first<=17?first:((first-5)%13+13)%13+5;
}

function parseBirthDate(value){
  if(!value) return null;
  const m=value.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m?{year:Number(m[1]),month:Number(m[2]),day:Number(m[3])}:null;
}

function anniversaryDate(year,month,day){
  const lastDay=new Date(year,month,0).getDate();
  return {year,month,day:Math.min(day,lastDay)};
}

function formatDate(d){return `${d.year}年${d.month}月${d.day}日`;}

function getAutoYears(birthDate){
  const d=parseBirthDate(birthDate);
  if(!d) return [];
  const {month,day}=d;
  const now=new Date();
  const cy=now.getFullYear();
  return [calcAnnualYear(cy,month,day),calcAnnualYear(cy+1,month,day),calcAnnualYear(cy+2,month,day)];
}

function updateAutoYears(){
  const birth=document.getElementById('birthDate').value;
  const years=getAutoYears(birth);
  const display=document.getElementById('autoYearsDisplay');
  if(years.length===0||!birth){
    display.innerHTML='<strong>📅 三年年度策略：</strong><span style="color:var(--text-light);font-size:.8rem">请先选择出生日期，自动计算</span>';
    return;
  }
  const d=parseBirthDate(birth);
  const month=d.month, day=d.day;
  const nowY=new Date().getFullYear();
  let html='<strong>📅 三年年度策略：</strong>';
  for(let i=0;i<years.length;i++){
    const y=years[i];
    const s=ANNUAL_STRATEGY[y];
    const cls=s&&s.type==='expand'?'yr-expand':'yr-settle';
    const label=s?ANNUAL_NAMES[y]:'';
    const sy=nowY+i;
    const startDate=anniversaryDate(sy,month,day);
    const endDate=anniversaryDate(sy+1,month,day);
    const ds=`${formatDate(startDate)} 至 ${formatDate(endDate)}`;
    html+=`<span class="yr-badge ${cls}">${label}<br><small style="font-size:.65rem;opacity:.7">${ds}</small></span>`;
  }
  display.innerHTML=html;
}

// ==================== 分析引擎 ====================
function analyzeEnergy(talents){
  const counts={wind:0,fire:0,water:0,earth:0};
  const energyTalents={wind:[],fire:[],water:[],earth:[]};
  for(let t of talents){
    if(t.absorbedByResonance) continue;
    const d=TALENT_DETAIL[t.num]; if(!d) continue;
    const e=d.energy; counts[e]+=t.multiplier; energyTalents[e].push({...t,detail:d});
  }
  const zeros=[];
  for(let [k,c] of Object.entries(counts)){if(c===0) zeros.push(k);}
  return {counts,energyTalents,zeros};
}

function findCombos(talents,selectedCombos=[]){
  // 组合天赋必须由录入者明确选择；潜能天赋不参与，也不根据名称自动猜测。
  const talentNums=new Set(talents.map(t=>t.num));
  return selectedCombos.filter(combo=>combo&&combo.nums.every(n=>talentNums.has(n)));
}

function getEnergyRanking(talents,combos,potentialNums){
  const mains=talents.filter(t=>t.role!=='aux');
  const auxs=talents.filter(t=>t.role==='aux');
  const auxNums=new Set(auxs.map(t=>t.num));
  const resonantNums=new Set(mains.filter(t=>auxNums.has(t.num)).map(t=>t.num));
  const core=mains.filter(t=>t.multiplier>=3||resonantNums.has(t.num));
  const overlap=mains.filter(t=>t.multiplier===2&&!resonantNums.has(t.num));
  const single=mains.filter(t=>t.multiplier===1&&!resonantNums.has(t.num));
  const standaloneAux=auxs.filter(t=>!resonantNums.has(t.num));
  return {core,combos,overlap,single,aux:standaloneAux,resonantNums,potentialNums};
}

function getDirectionCareerExamples(direction,contributors){
  const keywords=CAREER_EXAMPLE_KEYWORDS[direction.id]||[];
  const candidates=[];
  for(const contributor of contributors){
    const careers=TALENT_DETAIL[contributor.num]?.careers||[];
    for(const career of careers){
      const matched=keywords.some(keyword=>career.includes(keyword));
      candidates.push({career,matched,score:contributor.value+(matched?20:0)});
    }
  }
  candidates.sort((a,b)=>b.score-a.score||Number(b.matched)-Number(a.matched));
  const result=[];
  for(const item of candidates){if(!result.includes(item.career)) result.push(item.career);if(result.length===3) break;}
  for(const fallback of direction.examples){if(result.length<3&&!result.includes(fallback))result.push(fallback);}
  return result.slice(0,3);
}

function getCareerDirections(talents,combos){
  const comboNums=new Set(combos.flatMap(c=>c.nums));
  return CAREER_ARCHETYPES.map(direction=>{
    let score=0,contributors=[];
    for(const t of talents){
      if(t.absorbedByResonance) continue;
      const fit=direction.weights[t.num]||0;
      if(!fit) continue;
      const roleFactor=t.role==='aux'?.55:1;
      const comboFactor=comboNums.has(t.num)?1.12:1;
      score+=fit*(t.multiplier||1)*roleFactor*comboFactor;
      contributors.push({num:t.num,name:t.name,value:fit*(t.multiplier||1)});
    }
    contributors.sort((a,b)=>b.value-a.value);
    return {...direction,score,examples:getDirectionCareerExamples(direction,contributors),contributors:contributors.slice(0,3).map(x=>x.name)};
  }).sort((a,b)=>b.score-a.score||a.title.localeCompare(b.title,'zh-CN')).slice(0,5);
}

// ==================== 合盘 ====================
function analyzeSynastry(analysis1,analysis2){
  if(!analysis1||!analysis2) return null;
  const t1=analysis1.talents,t2=analysis2.talents;
  const mains1=t1.filter(t=>t.role!=='aux');
  const auxs1=t1.filter(t=>t.role==='aux');
  const mains2=t2.filter(t=>t.role!=='aux');
  const auxs2=t2.filter(t=>t.role==='aux');
  
  let reasons=[],score=0;
  
  // 规则1：主天赋×辅助天赋匹配
  const matchPairs=[];
  for(let m of mains1){for(let a of auxs2){if(m.num===a.num){matchPairs.push(`${escapeHtml(analysis1.name)}的${m.name}（主）↔ ${escapeHtml(analysis2.name)}的${a.name}（辅）`);score+=3;}}}
  for(let m of mains2){for(let a of auxs1){if(m.num===a.num){matchPairs.push(`${escapeHtml(analysis2.name)}的${m.name}（主）↔ ${escapeHtml(analysis1.name)}的${a.name}（辅）`);score+=3;}}}
  if(matchPairs.length>0) reasons.push({title:'主辅共振',detail:'双方的主要天赋与辅助天赋互相呼应，能自然形成互补与滋养的关系。',pairs:matchPairs});
  
  // 规则2：合并后形成组合天赋
  const allNums1=new Set(t1.map(t=>t.num)),allNums2=new Set(t2.map(t=>t.num));
  const combinedNums=new Set([...allNums1,...allNums2]);
  const comboMatch=[];
  for(let c of COMBOS){if(c.nums.every(n=>combinedNums.has(n))) comboMatch.push(c);}
  if(comboMatch.length>0){score+=5;reasons.push({title:'组合天赋契合',detail:'双方天赋合并后形成了完整的组合能量，在一起时能激发超越各自单独时的协同效应。',combos:comboMatch});}
  
  // 规则3：同能量类型重合
  const e1={},e2={};
  for(let t of t1){if(t.absorbedByResonance)continue;const e=TALENT_DETAIL[t.num]?.energy;if(e){if(!e1[e])e1[e]=0;e1[e]+=t.multiplier;}}
  for(let t of t2){if(t.absorbedByResonance)continue;const e=TALENT_DETAIL[t.num]?.energy;if(e){if(!e2[e])e2[e]=0;e2[e]+=t.multiplier;}}
  const sharedEnergy=[];
  for(let e of ['wind','fire','water','earth']){if((e1[e]||0)>0&&(e2[e]||0)>0) sharedEnergy.push(ENERGY_TYPES[e].name);}
  if(sharedEnergy.length>=2){score+=sharedEnergy.length;reasons.push({title:'能量共鸣',detail:`双方在${sharedEnergy.join('、')}等领域有共同的能量语言，沟通更顺畅，理解更深入。`});}
  
  let level,levelClass,desc;
  if(score>=6){level='💎 高度契合';levelClass='match-high';desc='你们的天赋组合在亲密关系和亲子协作上展现出难得的高度和谐。在情感连接上能互相深度理解与滋养，在共同养育或教育孩子时能形成天然互补——一方擅长的恰好是另一方需要支持的领域。是非常理想的伴侣或亲子协作拍档。';}
  else if(score>=3){level='🌟 良好契合';levelClass='match-mid';desc='你们之间存在明显的天赋共振点。在亲密关系中能通过特定领域的共鸣建立深度连接；在亲子协作方面也有良好的互补基础。建议在契合度高的方向上多投入，用默契消解分歧。';}
  else{level='🤝 一般契合';levelClass='match-note';desc='你们的天赋分布在不同的能量领域，各有独特优势。在亲密关系中需要更多的主动沟通来弥合理解差异，差异可以带来新鲜视角和成长空间。在亲子协作上建议多多互相倾听、发挥各自所长。';}
  
  return {level,levelClass,desc,reasons,score};
}

function escapeHtml(value){
  return String(value||'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
}

function buildAnalysis(name,birth,structured){
  if(!structured||structured.talents.length===0) return null;
  const auxNums=new Set(structured.talents.filter(t=>t.role==='aux').map(t=>t.num));
  const promotedNums=new Set(structured.talents.filter(t=>t.role!=='aux'&&t.multiplier===1&&auxNums.has(t.num)).map(t=>t.num));
  const talents=structured.talents.map(t=>{
    if(t.role!=='aux'&&promotedNums.has(t.num)){
      return {...t,originalMultiplier:1,multiplier:3,resonancePromoted:true};
    }
    if(t.role==='aux'&&promotedNums.has(t.num)) return {...t,absorbedByResonance:true};
    return {...t};
  });
  const combos=findCombos(talents,structured.combos);
  const energy=analyzeEnergy(talents);
  return {name,birth,talents,potentialNums:structured.potentialNums,counts:energy.counts,zeros:energy.zeros,combos,ranking:getEnergyRanking(talents,combos,structured.potentialNums),years:getAutoYears(birth)};
}

  document.querySelectorAll('.tab').forEach(t=>{if(t.textContent.includes(tabMap[tab]))t.classList.add('active');});
  
  const results=document.getElementById('results');
  const a=window._analysis;
  if(!a){results.innerHTML='<div class="placeholder-banner"><p>请先输入天赋信息并点击「开始解读」</p></div>';return;}
  
  if(tab==='career'){results.innerHTML=renderCareerCard(a.name,a.talents,a.counts,a.zeros,a.ranking,a.combos,a.potentialNums);}
  else if(tab==='relations'){
    results.innerHTML=renderLoveCard(a.name,a.counts,a.talents,a.counts.water||0)+renderParentCard(a.name,a.talents,a.counts)+renderMoneyCard(a.name,a.talents,a.counts);
  }
  else if(tab==='annual'){results.innerHTML=renderAnnualCard(a.years,a.birth);}
}

function canvasRoundRect(ctx,x,y,w,h,r,fill,stroke){
  ctx.beginPath();ctx.roundRect(x,y,w,h,r);
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();}
}

function canvasWrappedText(ctx,text,x,y,maxWidth,lineHeight,maxLines=2){
  const chars=String(text).split('');let line='',lines=[];
  for(const ch of chars){
    const test=line+ch;
    if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=ch;}else line=test;
  }
  if(line) lines.push(line);
  if(lines.length>maxLines){lines=lines.slice(0,maxLines);let last=lines[maxLines-1];while(ctx.measureText(last+'…').width>maxWidth)last=last.slice(0,-1);lines[maxLines-1]=last+'…';}
  lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lineHeight));
  return lines.length*lineHeight;
}

function exportCareerImage(){

  const auxData=aux?AUX_TO_POTENTIAL[aux.num]:null;
  const directions=getCareerDirections(a.talents,a.combos);
  const energyTop=270;
  const energyBottom=energyTop+174;
  const zeroHeight=a.zeros.length?50+a.zeros.length*66:0;
  const structureTop=energyBottom+zeroHeight+38;
  const talentRows=Math.ceil(mains.length/2);
  const talentGridHeight=talentRows*118;
  const auxHeight=auxData?92:0;

  const canvasHeight=careerTop+54+directions.length*76+92;
  const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=canvasHeight;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#f3eee7';ctx.fillRect(0,0,1080,canvasHeight);
  ctx.shadowColor='rgba(61,76,65,.14)';ctx.shadowBlur=28;ctx.shadowOffsetY=10;
  canvasRoundRect(ctx,48,42,984,canvasHeight-70,28,'#fffdf9','#e5d9ca');
  ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;
  canvasRoundRect(ctx,70,62,940,130,22,'#eef4f0','#dce8e0');
  ctx.beginPath();ctx.arc(950,92,30,0,Math.PI*2);ctx.fillStyle='#dfc6a8';ctx.globalAlpha=.55;ctx.fill();ctx.globalAlpha=1;
  ctx.beginPath();ctx.arc(918,132,15,0,Math.PI*2);ctx.fillStyle='#8eaa99';ctx.globalAlpha=.45;ctx.fill();ctx.globalAlpha=1;
  ctx.textBaseline='top';ctx.fillStyle='#365544';ctx.font=IMAGE_FONTS.hero;ctx.fillText('识己 · 天赋职业全览',94,84);
  ctx.fillStyle='#7a7c76';ctx.font=IMAGE_FONTS.meta;ctx.fillText(`${a.name}  ·  ${a.birth}`,96,148);
  ctx.fillStyle='#bd8750';ctx.fillRect(88,210,904,3);

  canvasSectionTitle(ctx,'四大天赋占比',88,230);
  const total=Object.values(a.counts).reduce((s,n)=>s+n,0)||1;
  const energyKeys=['wind','fire','water','earth'];
  energyKeys.forEach((key,i)=>{
    const et=ENERGY_TYPES[key],pct=Math.round((a.counts[key]||0)/total*100);
    const x=88+(i%2)*460,y=energyTop+Math.floor(i/2)*86;

    ctx.fillStyle=et.color;ctx.font=IMAGE_FONTS.cardTitle;ctx.fillText(et.name,x+16,y+10);
    ctx.textAlign='right';ctx.fillText(`${pct}%`,x+420,y+10);ctx.textAlign='left';
    canvasRoundRect(ctx,x+16,y+43,408,12,6,'#e9e5df');
    if(pct>0)canvasRoundRect(ctx,x+16,y+43,Math.max(8,408*pct/100),12,6,et.color);
  });

  if(a.zeros.length){
    let zeroY=energyBottom+10;
    canvasSectionTitle(ctx,'0能量提醒',88,zeroY,'#b06d3f');
    zeroY+=42;
    a.zeros.forEach(key=>{
      const et=ENERGY_TYPES[key];
      canvasRoundRect(ctx,88,zeroY,904,56,10,'#fff6ee','#edcfb1');

      ctx.fillStyle='#766b62';ctx.font=IMAGE_FONTS.body;canvasWrappedText(ctx,et.zeroMsg,218,zeroY+8,752,20,2);
      zeroY+=66;
    });
  }

  canvasSectionTitle(ctx,'天赋结构与职业提示',88,structureTop);
  if(a.combos.length){
    ctx.fillStyle='#9a693f';ctx.font=IMAGE_FONTS.bodyStrong;ctx.fillText(`组合天赋：${a.combos.map(c=>c.name).join('、')}`,360,structureTop+6);
  }
  const getRankLabel=t=>a.ranking.core.some(x=>x.num===t.num)?'核心天赋':a.ranking.overlap.some(x=>x.num===t.num)?'重叠天赋':'主天赋';
  mains.forEach((t,i)=>{
    const d=TALENT_DETAIL[t.num],x=88+(i%2)*460,y=structureTop+48+Math.floor(i/2)*118;
    const et=ENERGY_TYPES[d.energy];

  let detailY=structureTop+48+talentGridHeight;

  });

  ctx.fillStyle='#e6ded4';ctx.fillRect(110,canvasHeight-70,860,1);

  const link=document.createElement('a');
  link.download=`识己-${a.name}-天赋职业全览.png`;
  link.href=canvas.toDataURL('image/png');
  link.click();
}
