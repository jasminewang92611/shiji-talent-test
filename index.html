<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>识己天赋测试</title>
<link rel="stylesheet" href="print.css" media="print">
<style>
/* ============================================
   识己 · 东方美学视觉体系
   取意：宣纸 / 墨色 / 朱砂 / 泥金 / 黛青
   ============================================ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --paper:#faf6ed; --paper-warm:#f7f1e4; --rice:#fffef9;
  --ink:#2c2416; --ink-soft:#5c5240; --ink-muted:#999183;
  --vermillion:#c04040; --vermillion-light:#fef5f5;
  --celadon:#3d5c54; --celadon-deep:#2a423a; --celadon-ghost:#eef4f1;
  --gold:#b8944c; --gold-deep:#8c6a32; --gold-ghost:#faf4e8;
  --ochre:#8b5e3c; --ochre-light:#fdf6ef;
  --sky:#5f9a78; --fire:#cc6e4a; --water:#4f8f9a; --earth:#a07848;
  --sky-ghost:#e8f2e9; --fire-ghost:#fef3ed; --water-ghost:#e5f2f4; --earth-ghost:#f4ede0;
  --radius:12px;
  --font-song:"Noto Serif SC","Source Han Serif SC","SimSun","STSong",serif;
  --font-hei:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",-apple-system,sans-serif;
  --shadow-card:0 2px 4px rgba(44,36,22,.04),0 8px 24px rgba(44,36,22,.06);
  --shadow-float:0 4px 8px rgba(44,36,22,.05),0 16px 40px rgba(44,36,22,.08);
  --primary:var(--celadon); --primary-light:var(--celadon-ghost);
  --accent:var(--ochre); --text-light:var(--ink-muted);
}
body{font-family:var(--font-hei);background:var(--paper);color:var(--ink);line-height:1.85;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 70% 42% at 50% -8%,rgba(184,148,76,.11),transparent 62%),radial-gradient(ellipse 42% 30% at 92% 12%,rgba(61,92,84,.07),transparent 68%),repeating-linear-gradient(0deg,rgba(93,76,50,.018) 0,rgba(93,76,50,.018) 1px,transparent 1px,transparent 5px);opacity:.72}
body::after{content:'';position:fixed;left:0;right:0;top:0;height:5px;z-index:3;pointer-events:none;background:linear-gradient(90deg,var(--celadon-deep) 0 36%,var(--gold) 36% 64%,var(--vermillion) 64%)}
::selection{background:rgba(192,64,64,.16);color:var(--ink)}
.app{max-width:880px;margin:0 auto;padding:56px 24px 96px;position:relative;z-index:1}

/* ══════ 顶栏 · 如卷轴天头 ══════ */
.header{text-align:center;padding:76px 20px 68px;position:relative}
.header::after{content:'';display:block;width:116px;height:1px;margin:25px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.header h1{display:inline-block;font-family:var(--font-song);font-size:2.6rem;color:var(--ink);font-weight:700;letter-spacing:.2em;line-height:1.2;position:relative;text-shadow:0 1px 0 #fff}
.header h1::before{content:'识\A己';white-space:pre;position:absolute;left:-54px;top:-7px;width:34px;height:42px;padding-top:3px;background:var(--vermillion);color:#fff8ec;border-radius:2px;font:700 13px/17px var(--font-song);letter-spacing:0;box-shadow:inset 0 0 0 2px rgba(255,248,236,.55),0 4px 10px rgba(128,39,35,.15);transform:rotate(-2deg)}
.header .sub{color:var(--ink-muted);font-size:.82rem;margin-top:16px;letter-spacing:.3em;font-weight:400}

/* ══════ 输入区 · 如信笺 ══════ */
.input-panel{background:rgba(255,254,249,.94);border-radius:var(--radius);padding:46px 48px;box-shadow:var(--shadow-card);margin-bottom:38px;border:1px solid #dfd4c0;position:relative;overflow:hidden}
.input-panel::before{content:'';position:absolute;top:0;left:0;width:100%;height:4px;background:linear-gradient(90deg,var(--celadon-deep) 0 68%,var(--gold) 68% 86%,var(--vermillion) 86%)}
.input-panel::after{content:'天赋自有章法';position:absolute;right:-32px;top:92px;color:rgba(139,94,60,.075);font:700 15px var(--font-song);letter-spacing:.35em;transform:rotate(90deg);pointer-events:none}
.input-panel h2{font-family:var(--font-song);font-size:1rem;color:var(--ink);margin-bottom:28px;font-weight:700;letter-spacing:.1em;padding-bottom:14px;border-bottom:1px solid #e8e0d0;position:relative}
.input-panel h2::after{content:'';position:absolute;bottom:-1px;left:0;width:40px;height:2px;background:var(--vermillion)}
.input-row{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:22px}
.input-group{flex:1;min-width:180px}
.input-group label{display:block;font-size:.72rem;color:var(--ochre);margin-bottom:8px;font-weight:600;letter-spacing:.15em}
.input-group input,.input-group textarea,.input-group select{width:100%;padding:13px 16px;border:1.5px solid #e0d8c4;border-radius:6px;font-size:.88rem;font-family:var(--font-hei);background:var(--rice);transition:all .25s;color:var(--ink);outline:none}
.input-group input:focus,.input-group textarea:focus,.input-group select:focus{border-color:var(--celadon);box-shadow:0 0 0 3px rgba(61,92,84,.06);background:#fff}
.input-group textarea{resize:vertical;min-height:64px}
.input-group .hint{font-size:.7rem;color:var(--ink-muted);margin-top:6px;letter-spacing:.04em}
.date-selects{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:8px}
.date-selects select{min-width:0;padding-left:12px;padding-right:30px;background-color:var(--rice);background-position:right 9px center}
.date-selects select:invalid{color:var(--ink-muted)}
.auto-years{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:18px 0;font-size:.82rem}
.auto-years strong{color:var(--ink);font-weight:700;letter-spacing:.06em}
.auto-years .yr-badge{display:inline-block;padding:5px 18px;border-radius:3px;font-size:.74rem;font-weight:700;letter-spacing:.06em}
.yr-expand{background:#f4ede2;color:#9a7436;border-left:3px solid #9a7436}
.yr-settle{background:#efefec;color:#3f3a33;border-left:3px solid #6d6962}
.btn-row{display:flex;gap:14px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.btn{padding:12px 36px;border:none;border-radius:4px;font-size:.88rem;cursor:pointer;font-family:var(--font-hei);font-weight:600;transition:all .3s cubic-bezier(.25,.1,.25,1);letter-spacing:.08em}
.btn-primary{background:var(--celadon);color:#fff}
.btn-primary:hover{background:var(--celadon-deep);transform:translateY(-1px);box-shadow:0 6px 18px rgba(61,92,84,.18)}
.btn-outline{background:transparent;color:var(--celadon);border:1.5px solid #b0c8ba}
.btn-outline:hover{background:var(--celadon-ghost);border-color:var(--celadon)}
.btn-export{background:var(--vermillion);color:#fff}
.btn-export:hover{background:#a03030;box-shadow:0 6px 18px rgba(192,64,64,.18)}
.btn:disabled{cursor:not-allowed;opacity:.46;transform:none!important;box-shadow:none!important}
.btn-small{padding:8px 24px;font-size:.78rem;border-radius:3px}
.analysis-state-notice{display:none;margin:16px auto 0;max-width:520px;padding:10px 14px;background:#fbf0e9;border-left:3px solid var(--vermillion);color:#8d4b3d;border-radius:0 4px 4px 0;font-size:.75rem;line-height:1.7;text-align:center}
.analysis-state-notice.show{display:block}
.talent-builder{display:grid;gap:16px}
.builder-step{padding:22px 24px;background:linear-gradient(135deg,rgba(247,241,228,.88),rgba(255,254,249,.96));border:1px solid #e3d9c6;border-radius:8px;position:relative;transition:border-color .25s,box-shadow .25s}
.builder-step-title{display:flex;align-items:center;gap:10px;color:var(--celadon);font-size:.85rem;font-weight:700;margin-bottom:12px;letter-spacing:.06em}
.step-no{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:2px;background:var(--vermillion);color:#fff;font-size:.7rem;font-weight:700;font-family:var(--font-song)}
.builder-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.select-row{display:grid;grid-template-columns:minmax(0,1fr) 105px 38px;gap:10px;margin-top:10px;align-items:center}
.select-row.potential-row{grid-template-columns:minmax(0,1fr) 38px}
.icon-btn{width:36px;height:36px;border:1.5px solid #d8ceb8;border-radius:4px;background:var(--rice);color:var(--ochre);cursor:pointer;font-size:.95rem;transition:all .2s}
.icon-btn:hover{background:var(--vermillion-light);color:var(--vermillion);border-color:var(--vermillion)}
.add-row-btn{margin-top:12px;border:1px dashed #c0b898;border-radius:4px;background:transparent;color:var(--celadon);padding:9px 14px;cursor:pointer;font-family:var(--font-hei);font-size:.78rem;transition:all .2s}
.add-row-btn:hover{background:var(--celadon-ghost);border-color:var(--celadon)}
.builder-summary{padding:16px 18px;background:linear-gradient(135deg,var(--celadon-ghost),var(--gold-ghost));border-radius:6px;color:var(--celadon-deep);font-size:.78rem;line-height:1.9;border-left:3px solid var(--celadon)}
.field-note{font-size:.71rem;color:var(--ink-muted);margin-top:6px}

/* ══════ 导航 · 如书签 ══════ */
.tabs{display:flex;gap:0;background:rgba(255,254,249,.94);border-radius:var(--radius);box-shadow:var(--shadow-card);overflow:hidden;margin-bottom:38px;padding:7px;border:1px solid #dfd4c0}
.tab{flex:1;padding:15px 8px;text-align:center;cursor:pointer;font-size:.8rem;font-weight:500;color:var(--ink-soft);border:none;background:transparent;font-family:var(--font-hei);transition:all .3s;letter-spacing:.08em;position:relative}
.tab::after{content:'';position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:0;height:2px;background:var(--vermillion);transition:width .3s}
.tab:hover{color:var(--celadon)}
.tab.active{color:var(--celadon-deep);font-weight:700;background:linear-gradient(180deg,rgba(238,244,241,.82),rgba(238,244,241,.3));border-radius:6px}
.tab.active::after{width:24px}

/* ══════ 卡片 · 如册页 ══════ */
.card{background:var(--earth-ghost);border-radius:var(--radius);box-shadow:var(--shadow-card);padding:50px 52px;margin-bottom:34px;border:1px solid #dfd4c0;position:relative;overflow:hidden}
.card::before,.card::after{content:'';position:absolute;width:38px;height:38px;pointer-events:none;opacity:.48}
.card::before{left:13px;top:13px;border-left:1px solid var(--gold);border-top:1px solid var(--gold)}
.card::after{right:13px;bottom:13px;border-right:1px solid var(--gold);border-bottom:1px solid var(--gold)}
.card-header{display:flex;align-items:center;gap:18px;margin-bottom:36px;padding-bottom:22px;border-bottom:1px solid #e8e0d0}
.card-icon{width:50px;height:50px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:1.25rem;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.56)}
.card-title{font-family:var(--font-song);font-size:1.25rem;color:var(--ink);font-weight:700;letter-spacing:.08em}
.card-client{font-size:.8rem;color:var(--ink-muted);margin-top:4px;letter-spacing:.04em}

/* ══════ 能量分析 · 如牌匾 ══════ */
.energy-section{margin-bottom:44px}
.energy-section h3{font-size:1rem;color:var(--ink);margin-bottom:28px;font-family:var(--font-song);font-weight:700;letter-spacing:.1em;position:relative;padding-left:16px}
.energy-section h3::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:4px;height:20px;background:var(--vermillion);border-radius:2px}
.energy-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px}
.energy-item{padding:28px 24px;border-radius:8px;background:linear-gradient(160deg,#fffef9,var(--paper-warm));border:1px solid #e3d9c6;transition:all .3s;text-align:center;position:relative;overflow:hidden}
.energy-item::after{content:'';position:absolute;right:-24px;bottom:-32px;width:82px;height:82px;border:1px solid rgba(184,148,76,.14);border-radius:50%}
.energy-item:hover{transform:translateY(-3px);box-shadow:var(--shadow-float)}
.energy-item .energy-label{font-size:.7rem;color:var(--ink-muted);margin-bottom:12px;font-weight:600;letter-spacing:.15em}
.energy-item .energy-name{font-size:2.4rem;font-weight:700;margin-bottom:18px;font-family:var(--font-song);line-height:1;letter-spacing:.04em}
.energy-item .energy-bar-wrap{height:6px;background:#e8e0d0;border-radius:3px;overflow:hidden;margin-bottom:10px}
.energy-item .energy-bar{height:100%;border-radius:3px;transition:width 1s cubic-bezier(.22,1,.36,1)}
.energy-item .energy-count{font-size:.74rem;color:var(--ink-soft);line-height:1.6}
.energy-item.zero{background:var(--vermillion-light);border-color:#f0d0d0}
.energy-item.wind{background:var(--sky-ghost);border-color:#c7dccb}
.energy-item.fire{background:var(--fire-ghost);border-color:#efd0c1}
.energy-item.water{background:var(--water-ghost);border-color:#c9e1e4}
.energy-item.earth{background:var(--earth-ghost);border-color:#e2d1b7}
.energy-bar.wind-bar{background:linear-gradient(90deg,#87b99a,var(--sky))}
.energy-bar.fire-bar{background:linear-gradient(90deg,#e09070,var(--fire))}
.energy-bar.water-bar{background:linear-gradient(90deg,#6da8b2,var(--water))}
.energy-bar.earth-bar{background:linear-gradient(90deg,#c49a60,var(--earth))}
.energy-zero-alert{background:var(--vermillion-light);border-left:3px solid var(--vermillion);padding:20px 24px;margin:22px 0;font-size:.84rem;color:#8b3a3a;line-height:1.9;border-radius:0 6px 6px 0}
.energy-zero-alert strong{color:var(--vermillion);font-weight:700}

/* ══════ 强弱排名 · 如卷轴目录 ══════ */
.ranking-section{margin-bottom:44px}
.ranking-section h3{font-size:1rem;color:var(--ink);margin-bottom:28px;font-family:var(--font-song);font-weight:700;letter-spacing:.1em;padding-left:16px;position:relative}
.ranking-section h3::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:4px;height:20px;background:var(--vermillion);border-radius:2px}
.ranking-list{list-style:none;display:flex;flex-direction:column;gap:0}
.ranking-item{display:flex;align-items:baseline;gap:16px;padding:16px 0;border-bottom:1px dotted #d8ceb8;font-size:.85rem;line-height:1.8}
.ranking-item:last-child{border-bottom:none}
.ranking-item .rank-num{font-family:var(--font-song);font-size:.9rem;font-weight:700;color:var(--vermillion);min-width:24px}
.ranking-item.r1 .rank-num{color:var(--vermillion)}
.ranking-item.r2 .rank-num{color:var(--gold)}
.ranking-item .rank-label{font-weight:700;color:var(--ink);min-width:90px;letter-spacing:.04em}
.ranking-item .rank-detail{color:var(--ink-soft)}

/* ══════ 天赋详解 · 如古籍注疏 ══════ */
.talent-detail{margin-bottom:32px;font-family:var(--font-hei)}
.talent-detail h3{font-size:1rem;color:var(--ink);margin-bottom:24px;font-family:var(--font-hei);font-weight:700;letter-spacing:.06em;padding-left:16px;position:relative}
.talent-detail h3::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:4px;height:20px;background:var(--vermillion);border-radius:2px}
.talent-detail h4{font-family:var(--font-hei);font-size:.96rem;color:var(--ink);margin-bottom:10px;font-weight:700;letter-spacing:.025em}
.talent-detail p{font-family:var(--font-hei);font-size:.85rem;color:var(--ink-soft);margin-bottom:8px;line-height:1.9}
.talent-detail .tag{display:inline-block;padding:3px 14px;border-radius:2px;font-size:.72rem;margin:3px 8px 3px 0;font-weight:600;letter-spacing:.04em}
.tag-wind{background:var(--sky-ghost);color:#3d6e80}
.tag-fire{background:var(--fire-ghost);color:#b05030}
.tag-water{background:var(--water-ghost);color:#33707a}
.tag-earth{background:var(--earth-ghost);color:#7a5a30}
.talent-reading-list{display:grid;gap:12px}
.talent-reading-card{--talent-accent:var(--celadon);--talent-wash:var(--celadon-ghost);position:relative;padding:20px 24px 21px 30px;background:var(--talent-wash);border:0;border-radius:0;overflow:hidden;box-shadow:none;transition:filter .25s}
.talent-reading-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--talent-accent)}
.talent-reading-card::after{display:none}
.talent-reading-card:hover{background:var(--talent-wash);filter:brightness(.985)}
.talent-reading-head{display:grid;grid-template-columns:34px minmax(0,1fr);gap:11px;align-items:start;margin-bottom:10px;padding:0;border:0;position:relative;z-index:1}
.talent-reading-no{width:auto;height:auto;display:block;padding-top:3px;background:none;border:0;border-radius:0;color:var(--talent-accent);font:700 .78rem/1.5 var(--font-hei);letter-spacing:.03em}
.talent-reading-title{font-family:var(--font-hei);font-size:.96rem!important;line-height:1.55;margin:0!important;color:var(--ink)!important;letter-spacing:.025em!important}
.talent-reading-multiplier{color:var(--talent-accent);margin-left:3px}
.talent-resonance-badge{display:inline-block;margin-top:4px;padding:0;background:none;color:var(--vermillion);border:0;font-family:var(--font-hei);font-size:.76rem;font-weight:600;letter-spacing:.025em}
.talent-reading-core{position:relative;z-index:1;font-family:var(--font-hei);font-size:.85rem!important;line-height:1.9!important;color:var(--ink-soft)!important;margin:0!important}
.talent-reading-careers{margin-top:12px;padding:0;border:0;position:relative;z-index:1}
.talent-reading-label{display:block;margin-bottom:6px;color:var(--gold-deep);font-family:var(--font-hei);font-size:.76rem;font-weight:700;letter-spacing:.04em}
.talent-reading-card .career-list{margin-top:0;gap:5px 16px}
.talent-reading-card .career-tag{padding:0;background:none;border:0;color:var(--ink);font-family:var(--font-hei);font-size:.85rem;font-weight:700;line-height:1.9;box-shadow:none}
.talent-reading-card .career-tag:hover{transform:none;background:none;border:0;box-shadow:none}
.talent-reading-path{margin-top:12px;padding:0;border:0;position:relative;z-index:1}
.talent-reading-path .talent-reading-label{margin:0 0 5px;color:var(--gold-deep)}
.talent-reading-path p,.talent-reading-guidance,.talent-reading-note{font-family:var(--font-hei);font-size:.85rem!important;line-height:1.9!important;color:var(--ink-soft)!important;margin:0!important}
.talent-reading-note{margin-top:8px!important;color:var(--gold-deep)!important}

/* ══════ 职业推荐 · 如匾额 ══════ */
.career-list{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.career-tag{padding:10px 24px;background:linear-gradient(180deg,#fffef9,var(--paper-warm));color:var(--celadon-deep);border-radius:3px;font-size:.78rem;font-weight:500;border:1px solid #d0c5ad;transition:all .3s;letter-spacing:.05em;box-shadow:inset 0 1px rgba(255,255,255,.8)}
.career-tag:hover{background:var(--celadon-ghost);border-color:var(--celadon);transform:translateY(-2px);box-shadow:0 4px 12px rgba(61,92,84,.08)}

/* ══════ 综合职业归向 · 解读收束页 ══════ */
.career-summary{margin-top:42px;padding:38px 36px 32px;background:var(--earth-ghost);border:1px solid #d9ccb3;border-radius:10px;position:relative;overflow:hidden;box-shadow:inset 0 1px rgba(255,255,255,.85)}
.career-summary::before{content:'';position:absolute;right:-75px;top:-85px;width:210px;height:210px;border:1px solid rgba(184,148,76,.15);border-radius:50%;box-shadow:0 0 0 28px rgba(184,148,76,.035),0 0 0 55px rgba(61,92,84,.025);pointer-events:none}
.career-summary::after{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--celadon-deep) 0 62%,var(--gold) 62% 82%,var(--vermillion) 82%)}
.career-summary-head{position:relative;padding:0 0 26px 64px;border-bottom:1px solid #d9ccb3;margin-bottom:24px}
.career-summary-seal{position:absolute;left:0;top:1px;width:43px;height:50px;display:flex;align-items:center;justify-content:center;background:var(--vermillion);color:#fff8e9;border-radius:2px;box-shadow:inset 0 0 0 2px rgba(255,248,233,.52);font:700 13px/1.25 var(--font-song);letter-spacing:.12em;text-align:center;writing-mode:vertical-rl}
.career-summary-kicker{display:block;color:var(--gold-deep);font-size:.68rem;font-weight:700;letter-spacing:.28em;margin-bottom:5px}
.career-summary h3{font-family:var(--font-song);font-size:1.2rem;color:var(--ink);letter-spacing:.1em;line-height:1.45}
.career-summary-intro{font-size:.78rem;color:var(--ink-muted);margin-top:7px;line-height:1.75}
.career-direction-list{display:grid;gap:14px;position:relative}
.career-direction{display:grid;grid-template-columns:50px minmax(0,1fr);gap:18px;padding:21px 22px 20px;background:var(--sky-ghost);border:1px solid #c9dce5;border-radius:8px;position:relative;transition:transform .25s,border-color .25s,box-shadow .25s}
.career-direction:nth-child(4n+2){background:var(--fire-ghost);border-color:#efd0c1}
.career-direction:nth-child(4n+3){background:var(--water-ghost);border-color:#c9e1e4}
.career-direction:nth-child(4n+4){background:var(--earth-ghost);border-color:#e2d1b7}
.career-direction::after{content:'';position:absolute;left:24px;top:71px;bottom:-15px;width:1px;background:linear-gradient(#d6c5a4,transparent)}
.career-direction:last-child::after{display:none}
.career-direction:hover{transform:translateX(3px);border-color:#bea979;box-shadow:0 8px 22px rgba(65,52,30,.07)}
.career-direction-no{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--celadon-deep);color:#fff9ec;font:700 1rem var(--font-song);box-shadow:0 0 0 5px #edf1ea;position:relative;z-index:1}
.career-direction:nth-child(2n) .career-direction-no{background:var(--vermillion);box-shadow:0 0 0 5px #f8ece5}
.career-direction-body{min-width:0}
.career-direction-title{font-family:var(--font-song);font-size:1rem;font-weight:700;color:var(--celadon-deep);letter-spacing:.045em;line-height:1.55}
.career-direction-core{font-size:.82rem;color:var(--ink-soft);line-height:1.8;margin-top:5px}
.career-direction-meta{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;align-items:start;margin-top:13px;padding-top:12px;border-top:1px dotted #d8c9ad;font-size:.76rem;line-height:1.75}
.career-direction-label{color:var(--gold-deep);font-weight:700;letter-spacing:.04em;white-space:nowrap}
.career-examples,.career-sources{display:flex;flex-wrap:wrap;gap:6px}
.career-example,.career-source{display:inline-flex;align-items:center;padding:3px 10px;border-radius:2px}
.career-example{background:#f4ece0;color:#7c5633;border:1px solid #e5d2b8}
.career-source{background:#edf2ee;color:#426454;border:1px solid #d4e0d8}
.career-summary-advice{margin-top:22px;padding:15px 18px 15px 44px;background:rgba(255,254,249,.72);border-left:2px solid var(--gold);color:var(--ink-soft);font-size:.78rem;line-height:1.85;position:relative}
.career-summary-advice::before{content:'择';position:absolute;left:13px;top:14px;color:var(--vermillion);font:700 18px var(--font-song)}
.career-summary .disclaimer{background:transparent;border:none;border-top:1px solid #d9ccb3;border-radius:0;padding:18px 4px 0;margin-top:22px;text-align:left;line-height:1.85}

/* ══════ 年度策略 · 如折页 ══════ */
.annual-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.annual-card{background:var(--sky-ghost);border-radius:8px;padding:28px 26px;border:1px solid #c9dce5;transition:all .3s}
.annual-card:nth-child(3n+2){background:var(--fire-ghost);border-color:#efd0c1}
.annual-card:nth-child(3n){background:var(--earth-ghost);border-color:#e2d1b7}
.annual-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-float)}
.annual-card .year-tag{display:inline-block;padding:6px 18px;border-radius:3px;font-size:.73rem;font-weight:700;margin-bottom:16px;letter-spacing:.06em}
.tag-expand{background:#f4ede2;color:#9a7436;border-left:3px solid #9a7436}
.tag-settle{background:#efefec;color:#3f3a33;border-left:3px solid #6d6962}
.annual-card.annual-expand{background:#f4ede2;border-color:#ddc99f}
.annual-card.annual-settle{background:#efefec;border-color:#d2d0cb}
.annual-compare{margin-top:24px;padding:20px;background:#f4ede2;border-radius:12px;border:1px solid #ddc99f}
.annual-compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.annual-compare-panel{padding:14px;border-radius:10px}
.annual-compare-panel.expand{background:#f4ede2;border:1px solid #ddc99f}
.annual-compare-panel.settle{background:#efefec;border:1px solid #d2d0cb}
.annual-compare-panel.expand strong{color:#9a7436}
.annual-compare-panel.settle strong{color:#3f3a33}
.annual-card h4{font-size:.92rem;margin-bottom:12px;font-family:var(--font-song);font-weight:700;color:var(--ink);letter-spacing:.06em}
.annual-card ul{margin:0;padding-left:18px}
.annual-card li{font-size:.8rem;color:var(--ink-soft);margin-bottom:8px;line-height:1.85;list-style-type:'— '}

/* ══════ 合盘 ══════ */
.match-level{text-align:center;padding:32px;margin:22px 0;border-radius:8px;font-weight:700;letter-spacing:.06em}
.match-high{background:var(--celadon-ghost);color:var(--celadon-deep);font-size:1.1rem;font-family:var(--font-song);border:1px solid #c0d4c8}
.match-mid{background:var(--gold-ghost);color:var(--gold-deep);font-size:1.05rem;font-family:var(--font-song);border:1px solid #e0d0b0}
.match-note{background:var(--paper-warm);color:var(--ink-soft);font-size:.88rem;border:1px solid #e8e0d0}
.synastry-actions{display:flex;justify-content:flex-end;margin-top:10px}

/* ══════ 报告封面 ══════ */
.report-cover{padding:36px 0 32px;text-align:center;border-bottom:2px solid var(--vermillion);margin-bottom:32px}
.report-cover h2{font-family:var(--font-song);color:var(--ink);font-size:1.6rem;font-weight:700;letter-spacing:.12em}
.report-cover p{font-size:.8rem;color:var(--ink-muted);margin-top:10px;letter-spacing:.06em}

/* ══════ 免责声明 ══════ */
.disclaimer{margin-top:32px;padding:22px 24px;background:var(--paper-warm);border-radius:6px;color:var(--ink-muted);font-size:.72rem;line-height:2;text-align:center;letter-spacing:.04em;border:1px solid #e8e0d0}

.placeholder-banner{background:var(--paper-warm)!important;border:1px dashed #d0c8b0!important;border-radius:var(--radius);padding:52px;text-align:center;color:var(--ink-muted)}
.placeholder-banner p{font-size:.85rem;letter-spacing:.06em}

@media(hover:hover){
  .energy-item:hover{transform:translateY(-4px);box-shadow:var(--shadow-float)}
  .builder-step:hover{border-color:#c8c0a8}
}

/* ══════ 打印 / PDF ══════ */
.print-report-footer{display:none}

  .career-summary{padding:30px 20px 26px}

  .career-direction{grid-template-columns:40px minmax(0,1fr);gap:12px;padding:18px 15px}
  .career-direction-no{width:36px;height:36px;font-size:.88rem}
  .career-direction::after{left:32px;top:61px}
  .career-direction-meta{grid-template-columns:1fr;gap:4px}

/* 潜能天赋与综合职业方向采用同一字级比例，避免两块阅读感割裂 */
@media screen{

<body>
<div class="app">
  <div class="header">
    <h1>识己天赋测试</h1>
    <div class="sub">看见天赋，照见自己</div>
  </div>

  <div class="input-panel" id="inputPanel">
    <h2>客户信息</h2>
    <div class="input-row">
      <div class="input-group"><label>客户姓名</label><input type="text" id="clientName" placeholder="例如：静静"></div>
      <div class="input-group"><label>阳历出生年月日</label><div class="date-selects" aria-label="阳历出生年月日"><select id="birthYear" aria-label="出生年份" required><option value="">年</option></select><select id="birthMonth" aria-label="出生月份" required><option value="">月</option></select><select id="birthDay" aria-label="出生日期" required><option value="">日</option></select></div><input type="hidden" id="birthDate"></div>
    </div>
    <div class="input-row"><div class="input-group" style="flex:2"><label>天赋信息</label><div id="clientTalentForm"></div></div></div>
    <div class="input-row">
      <div class="auto-years" id="autoYearsDisplay">
        <strong>📅 三年年度策略：</strong>
        <span style="color:var(--text-light);font-size:.8rem">请先选择出生日期，自动计算</span>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="runAnalysis()">开始解读</button>
      <button class="btn btn-outline" onclick="startNewClient()">新建客户 / 清空</button>
      <button class="btn btn-outline" id="exportCareerBtn" onclick="exportCareerImage()">导出职业卡片图片</button>
      <button class="btn btn-export" id="reportBtn" onclick="generateReport()">生成详细报告</button>
    </div>
    <div class="analysis-state-notice" id="analysisStateNotice" role="status">输入信息已经修改，请重新点击“开始解读”后再导出。</div>

    <!-- 合盘区域 -->
    <h2 style="margin-top:24px;cursor:pointer;color:var(--primary)" onclick="toggleSynastry()">合盘分析 ▸ 点击展开</h2>
    <div id="synastryPanel" style="display:none">
    <div class="input-row">
      <div class="input-group"><label>对方姓名</label><input type="text" id="partnerName" placeholder="例如：小明"></div>
      <div class="input-group"><label>对方阳历出生年月日</label><div class="date-selects" aria-label="对方阳历出生年月日"><select id="partnerYear" aria-label="对方出生年份" required><option value="">年</option></select><select id="partnerMonth" aria-label="对方出生月份" required><option value="">月</option></select><select id="partnerDay" aria-label="对方出生日期" required><option value="">日</option></select></div><input type="hidden" id="partnerBirth"></div>
    </div>
    <div class="input-row"><div class="input-group" style="flex:2"><label>对方天赋信息</label><div id="partnerTalentForm"></div></div></div>
    <div class="synastry-actions"><button class="btn btn-outline btn-small" onclick="runSynastry()">单独生成合盘</button></div>
    </div>
  </div>

  <div class="tabs" id="tabNav">
    <button class="tab active" onclick="switchTab('career')">天赋职业</button>
    <button class="tab" onclick="switchTab('annual')">年度策略</button>
    <button class="tab" onclick="switchTab('relations')">关系综合</button>
  </div>

  <div id="results"></div>
</div>

<script>
// ==================== 数据 ====================
const TALENT_NAMES={0:'创意天赋',1:'整合天赋',2:'敏锐天赋',3:'美育天赋',4:'挑战天赋',5:'价值天赋',6:'面相天赋',7:'家庭天赋',8:'教练天赋',9:'穿透天赋',10:'显化天赋',11:'悟性天赋',12:'趋势天赋',13:'执着天赋',14:'涉外天赋',15:'策略天赋',16:'执行天赋',17:'洞察天赋',18:'感知天赋',19:'资源天赋',20:'计划天赋',21:'传统天赋'};

const ENERGY_TYPES={
  wind:{name:'认知能量',symbol:'风',color:'#5d9675',light:'#e9f3e9',desc:'具备快速、多元的学习能力，擅长将知识转化为可变现的输出。思维灵活，表达逻辑清晰，天然适合知识型、顾问型工作。核心驱动力在于「学习—整合—输出」的循环。',nums:[0,1,6,11,17,20],zeroMsg:'您拥有广阔的思维空间，适合发展独特的认知风格。建议多肯定自己的贡献与价值，寻找欣赏您独特视角的导师或搭档，让思想的火花更有信心地绽放。'},
  fire:{name:'行动能量',symbol:'火',color:'#c86b58',light:'#fcece6',desc:'充满干劲，企图心强，直觉决断，适合竞争性、目标导向的工作环境。是天生的行动者，属于「竞争型人才」，最适合能够自主发挥的岗位。',nums:[4,8,14,16,19],zeroMsg:'您的行动节奏偏从容优雅，更适合深思熟虑后的精准出击。建议与行动力强的伙伴搭档，借助外部目标和协作关系，优雅地激活内在的行动潜能。'},
  water:{name:'情绪能量',symbol:'水',color:'#4e89a8',light:'#e8f1f7',desc:'以人为本，同理心强，情感连接能力卓越。擅长销售、活动、策划等需要「以情动人」的工作，属于「渗透型人才」，善于在无形中建立信任与影响力。',nums:[2,3,7,12,13,18],zeroMsg:'您的情绪感知灵敏而内敛，以理性思考见长。建议多与情感表达能力出色的伙伴交流，在合作中自然补充情感沟通的维度，让理性与感性相得益彰。'},
  earth:{name:'构建能量',symbol:'土',color:'#a77a37',light:'#f7eedb',desc:'擅长结构性思考，做事有计划且落地，善于提供解决方案。注重实效、讲究细节，金钱能量强，是组织和团队中的「落实型人才」。',nums:[5,9,10,15,21],zeroMsg:'您拥有开放灵动的思维特质，创意和灵感是其天然优势。建议搭配结构化工具辅助执行落地，或与擅长构建的伙伴协作，让灵感找到扎根的土壤。'}
};

const TALENT_DETAIL={
  0:{name:'创意天赋',energy:'wind',core:'极具创意与灵感，想象力超群，思维跳脱常规，敢于从零开始打造全新方案。具备天然的领导者气质，勇于挑战既有框架。',careers:['广告创意','品牌策划','AI产品设计','公关传播','编剧导演','初创企业创始人','内容创作','创业顾问'],path:'必须将创意落地为具体作品，广泛学习跨领域知识，建立持续输出机制。持续将灵感通过项目经历转化为可见价值，让创意成为可交付的现实。'},
  1:{name:'整合天赋',energy:'wind',core:'学习速度极快，善于将不同领域的知识整合并升华成更优的版本。文字表达能力出色，逻辑清晰，是天然的知识传播者与策略沟通者。',careers:['知识付费讲师','商业撰稿','策略顾问','培训师','商业谈判专家','课程研发','内容总监'],path:'持续文字输出与教学，积累作品集。以教促学，加速知识的内化与变现。需要注意保持学习的深度沉淀，确保输入与输出的良性循环。'},
  2:{name:'敏锐天赋',energy:'water',core:'内心细腻，对他人情绪变化极度敏感，共情能力强。重视承诺与公平，外柔内刚，在感情与职业之间具备高度平衡能力。',careers:['情感咨询师','女性成长导师','珠宝美学品牌顾问','心理辅导师','高端个人形象顾问'],path:'建立稳定的内在安全感，不在情绪波动时做重要决策。通过精品配饰与外在气质管理提升自我认同感，强化职业形象气场。'},
  3:{name:'美育天赋',energy:'water',core:'与生俱来的高级美感与魅力，具备号召式领导力。亲子教养天赋突出，擅长经营陌生圈子，具备跨平台影响力。',careers:['美育教师','艺术策展','时尚博主','母婴品牌创业','社群主理人','美学顾问','儿童教育'],path:'精进外在条件，将美感资源转化为职业价值。善用线上平台开拓陌生市场，放大号召力。'},
  4:{name:'挑战天赋',energy:'fire',core:'好胜心强，精力旺盛，企图心十足，具备集中突破的强大驱动力。自尊心高，渴望被认可与重用，不甘在受限环境中发展。',careers:['创业者','销售冠军','竞技运动员','项目负责人','商业拓展','创新业务负责人'],path:'在有充分自主权的环境中发挥最佳状态，定期运动释放旺盛能量。注重建立专业成果的可见度，让实力被更多人看见。'},
  5:{name:'价值天赋',energy:'earth',core:'极强的说服力与价值传递能力，能激发他人改变信念、重新定义价值观。金钱能量第一，存款与收入能力俱佳。',careers:['金融顾问','投资理财规划师','保险高管','销售总监','公益演讲者','价值观教练'],path:'持续建立自我认同感，用说服力帮助他人发现自我价值。通过专业化、系统化的表达打磨影响力，让内在的丰盈成为稳定决策的基石。'},
  6:{name:'面相天赋',energy:'wind',core:'天生拥有镜头感与人际磁场，亲和力强，跨年龄层都受欢迎。学习力佳，能快速掌握新知识并生动表达，具备自然流量吸引力。',careers:['主持人','直播达人','品牌大使','销售顾问','演讲培训师','活动策划','形象顾问','社群运营'],path:'重点培养上台表达与直播能力，经营个人品牌，持续露脸积累人脉信任。通过人际关系变现放大天赋价值。'},
  7:{name:'家庭天赋',energy:'water',core:'以家庭为核心驱动力，守护欲望激发冒险精神。对衣食住行育乐领域天然感兴趣，做事有原则有规矩，适合家居相关产业。',careers:['房地产经纪','室内设计师','家居整理师','租赁管理','家庭教育顾问','育儿博主'],path:'将家庭价值观融入职业方向，在守护能量驱动下创业或经营。需要注意在关爱家人的同时，为彼此保留适当的弹性空间。'},
  8:{name:'教练天赋',energy:'fire',core:'擅长手把手辅导他人，在乎自己对他人的贡献与影响力。做事有韧性，深受长辈信任，具备团队激励与辅导能力。',careers:['职业教练','销售培训师','企业内训讲师','团队主管','HR发展顾问','导师型创业者'],path:'通过辅导他人积累成就感与自信。需要注意在助人同时建立清晰的专业边界，用作品和成果强化个人声望。'},
  9:{name:'穿透天赋',energy:'earth',core:'一针见血，能看透事物本质，快速定位问题并给出解决方案。注重私人领域与秩序，具备高度自我要求。',careers:['战略顾问','企业诊断师','管理咨询','市场分析师','研究型创业者','法务专员'],path:'以解决方案为核心价值进行变现，建立可输出的方法论体系。需要注意在追求卓越的同时以「完成比完美重要」平衡产出节奏。'},
  10:{name:'显化天赋',energy:'earth',core:'心想事成能量强，善于链接各类人脉与资源。海外能量突出，具备第二语言天赋，物质生活品质追求高。',careers:['跨国贸易','海外派驻管理者','高端资源整合','奢侈品行业','国际关系顾问','出海业务负责人'],path:'保持正向思维，主动拓展高端人脉，持续进修提升认知层次。需要注意显化能量对正向和负向想法同样有效，有意识地培养积极思维习惯。'},
  11:{name:'悟性天赋',energy:'wind',core:'领悟力极强，探寻真理和公平，能将复杂知识化繁为简，形成专业权威。天然具备专家气质，适合高端专业路线。',careers:['大学教授','律师','心理咨询师','医师','高端顾问','职业资格培训讲师','专业技术专家'],path:'积累高学历背景或权威认证，精深钻研某一专业领域，建立系统化知识体系。适合高价路线，守护专业价值。'},
  12:{name:'趋势天赋',energy:'water',core:'选人选物眼光极准，趋势感知力强。为人忠诚，注重情感连接，适合需要精准选择的岗位。',careers:['猎头顾问','时尚买手','品牌代理','采购总监','内容选品编辑','文创策划'],path:'工作时主动用理性眼光做趋势判断。发挥忠诚圈子文化的优势，建立高质量的专业人脉网络。'},
  13:{name:'执着天赋',energy:'water',core:'高自尊，执着，深度学习能力强，具备改革陋习的勇气。核检与自律能力卓越，适合深耕专业技能的工作环境。',careers:['质量管理专家','专业技术工匠','法律合规专员','精益生产顾问','高强度技术研发'],path:'找到能展现独特优势的专业方向，将执着力用于有意义的专业积累。需要注意在深耕的同时保留弹性与呼吸空间。'},
  14:{name:'涉外天赋',energy:'fire',core:'视野宽广，具有使命感驱动力，海外或跨文化环境中如鱼得水。第二语言能力天赋强，具备舞台感与启蒙他人的故事力。',careers:['外企管理者','外贸业务','海外项目负责人','国际演讲者','跨境电商','多语言内容创作者'],path:'通过旅行与跨文化交流扩展视野，主动寻求海外业务机会。锻炼故事化演讲能力，将个人使命感转化为职业竞争力。'},

// ==================== 解析 ====================
function talentOptions(selected=''){
  return '<option value="">请选择天赋</option>'+Object.entries(TALENT_NAMES).map(([num,name])=>`<option value="${num}" ${String(selected)===num?'selected':''}>${name}</option>`).join('');
}

function auxiliaryTalentOptions(selected=''){
  return '<option value="">请选择辅助天赋</option>'+Object.keys(AUX_TO_POTENTIAL).map(num=>`<option value="${num}" ${String(selected)===num?'selected':''}>${TALENT_NAMES[num]}（辅助面向：${AUX_TO_POTENTIAL[num].auxName}）</option>`).join('');
}

function potentialOptions(selected=''){
  return '<option value="">请选择潜能天赋</option>'+Object.entries(POTENTIAL_NAMES).map(([num,name])=>`<option value="${num}" ${String(selected)===num?'selected':''}>${name}</option>`).join('');
}

function comboOptions(selected=''){
  return '<option value="">无组合天赋</option>'+COMBOS.map((combo,index)=>`<option value="${index}" ${String(selected)===String(index)?'selected':''}>${combo.nums.map(n=>TALENT_NAMES[n]).join('＋')} · ${combo.name}</option>`).join('');
}

function renderStructuredTalentForm(prefix){
  const el=document.getElementById(prefix+'TalentForm');
  if(!el) return;
  el.innerHTML=`<div class="talent-builder">
    <div class="builder-step"><div class="builder-step-title"><span class="step-no">1</span>最强共振天赋</div><div class="builder-grid"><select id="${prefix}ResonanceMode" disabled><option value="no">已确认：无最强共振</option><option value="yes">已确认：有最强共振</option></select><select id="${prefix}ResonanceTalent" disabled>${talentOptions()}</select></div><div class="field-note">系统会先比对辅助天赋与主天赋：名称相同即自动确认为最强共振，没有相同则显示“无”。</div></div>
    <div class="builder-step"><div class="builder-step-title"><span class="step-no">2</span>组合天赋</div><select id="${prefix}Combo">${comboOptions()}</select><div class="field-note">只有这里明确选择后才会生成组合解读；潜能天赋不会参与组合判断。</div></div>
    <div class="builder-step"><div class="builder-step-title"><span class="step-no">3</span>主天赋（5—7个）</div><div id="${prefix}MainRows"></div><button type="button" class="add-row-btn" onclick="addMainRow('${prefix}')">＋ 添加主天赋</button></div>
    <div class="builder-step"><div class="builder-step-title"><span class="step-no">4</span>辅助天赋（1个 · ×0.5）</div><select id="${prefix}Aux" onchange="syncAuxResonance('${prefix}')">${auxiliaryTalentOptions()}</select><div class="field-note">括号内是辅助天赋特有的成长面向，与同名主天赋的外显优势有所区别。</div></div>
    <div class="builder-step"><div class="builder-step-title"><span class="step-no">5</span>潜能天赋（1—2个）</div><div id="${prefix}PotentialRows"></div><button type="button" class="add-row-btn" onclick="addPotentialRow('${prefix}')">＋ 添加潜能天赋</button><div class="field-note">仅显示描述性名称，客户卡片和报告中不会出现内部数字。</div></div>
    <div class="builder-summary" id="${prefix}BuilderSummary">请依次完成天赋选择，生成前系统会检查数量、重复项与组合关系。</div>
  </div>`;
  for(let i=0;i<5;i++) addMainRow(prefix);
  addPotentialRow(prefix);
}

function addMainRow(prefix,num='',multiplier=1){
  const box=document.getElementById(prefix+'MainRows');
  if(!box||box.children.length>=7) return;
  const row=document.createElement('div');
  row.className='select-row main-row';
  row.innerHTML=`<select class="main-talent" onchange="syncAuxResonance('${prefix}')">${talentOptions(num)}</select><select class="main-multiplier" onchange="updateBuilderSummary('${prefix}')"><option value="1" ${multiplier===1?'selected':''}>×1</option><option value="2" ${multiplier===2?'selected':''}>×2</option><option value="3" ${multiplier===3?'selected':''}>×3</option></select><button type="button" class="icon-btn" title="删除" onclick="removeBuilderRow(this,'${prefix}')">×</button>`;
  box.appendChild(row);
  syncAuxResonance(prefix);
}

function addPotentialRow(prefix,num=''){
  const box=document.getElementById(prefix+'PotentialRows');
  if(!box||box.children.length>=2) return;
  const row=document.createElement('div');
  row.className='select-row potential-row';
  row.innerHTML=`<select class="potential-talent" onchange="updateBuilderSummary('${prefix}')">${potentialOptions(num)}</select><button type="button" class="icon-btn" title="删除" onclick="removeBuilderRow(this,'${prefix}')">×</button>`;
  box.appendChild(row);
  updateBuilderSummary(prefix);
}

function removeBuilderRow(button,prefix){
  button.closest('.select-row')?.remove();
  syncAuxResonance(prefix);

function collectStructuredTalent(prefix,showAlert=true){
  const d=getStructuredDraft(prefix);
  const fail=msg=>{if(showAlert) alert(msg);return null;};
  if(d.mains.length<5||d.mains.length>7) return fail('请选择5—7个主天赋');
  const mainNums=d.mains.map(x=>Number(x.num));
  if(new Set(mainNums).size!==mainNums.length) return fail('主天赋不能重复，请检查选择');
  if(d.aux==='') return fail('请选择1个辅助天赋');
  if(d.potentials.length<1||d.potentials.length>2) return fail('请选择1—2个潜能天赋');
  if(new Set(d.potentials).size!==d.potentials.length) return fail('潜能天赋不能重复，请检查选择');
  const auxNum=Number(d.aux);
  const auxMatchesMain=mainNums.includes(auxNum);
  if(d.resonanceMode==='yes'){
    if(d.resonanceTalent==='') return fail('请选择最强共振天赋');
    if(Number(d.resonanceTalent)!==auxNum||!mainNums.includes(Number(d.resonanceTalent))) return fail('最强共振天赋必须同时出现在主天赋与辅助天赋中');
  }else if(auxMatchesMain){
    return fail('检测到主天赋与辅助天赋相同，请将“最强共振天赋”选择为“有”');
  }
  let combos=[];
  if(d.combo!==''){
    const combo=COMBOS[Number(d.combo)];
    if(!combo) return fail('组合天赋选择无效，请重新选择');
    const owned=new Set([...mainNums,auxNum]);
    if(!combo.nums.every(num=>owned.has(num))) return fail(`所选组合需要同时具备：${combo.nums.map(n=>TALENT_NAMES[n]).join('、')}`);
    combos=[combo];
  }
  const talents=d.mains.map(x=>({num:Number(x.num),name:TALENT_NAMES[Number(x.num)],multiplier:x.multiplier,role:'main',source:'select'}));
  talents.push({num:auxNum,name:TALENT_NAMES[auxNum],multiplier:.5,role:'aux',source:'select'});
  return {talents,potentialNums:d.potentials.map(Number),combos};
}

// 年度策略自动计算
function calcAnnualYear(year,month,day){
  const total=Number(year)+Number(month)+Number(day);
  const digitSum=n=>String(Math.abs(n)).split('').reduce((a,b)=>a+Number(b),0);
  const first=digitSum(total);
  // 正常年度会直接落在 5-17；极远年份以 13 个策略位循环兜底。
  return first>=5&&first<=17?first:((first-5)%13+13)%13+5;
}

function parseBirthDate(value){
  if(!value) return null;
  const m=String(value).match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);
  return m?{year:Number(m[1]),month:Number(m[2]),day:Number(m[3])}:null;
}

function initChineseDateSelect(prefix,hiddenId,onChange){
  const year=document.getElementById(prefix+'Year');
  const month=document.getElementById(prefix+'Month');
  const day=document.getElementById(prefix+'Day');
  const hidden=document.getElementById(hiddenId);
  if(!year||!month||!day||!hidden)return;
  const currentYear=new Date().getFullYear();
  for(let y=currentYear;y>=1900;y--){year.insertAdjacentHTML('beforeend',`<option value="${y}">${y}年</option>`);}
  for(let m=1;m<=12;m++){month.insertAdjacentHTML('beforeend',`<option value="${m}">${m}月</option>`);}
  const refreshDays=()=>{
    const selected=day.value;
    day.innerHTML='<option value="">日</option>';
    if(!year.value||!month.value){day.disabled=true;return;}
    day.disabled=false;
    const maxDay=new Date(Number(year.value),Number(month.value),0).getDate();
    for(let d=1;d<=maxDay;d++){day.insertAdjacentHTML('beforeend',`<option value="${d}">${d}日</option>`);}
    if(selected&&Number(selected)<=maxDay)day.value=selected;
  };
  const sync=()=>{
    if(year.value&&month.value&&day.value){
      hidden.value=`${year.value}-${String(month.value).padStart(2,'0')}-${String(day.value).padStart(2,'0')}`;
    }else hidden.value='';
    if(typeof onChange==='function')onChange();
  };
  year.addEventListener('change',()=>{refreshDays();sync();});
  month.addEventListener('change',()=>{refreshDays();sync();});
  day.addEventListener('change',sync);
  refreshDays();
}

function anniversaryDate(year,month,day){
  const lastDay=new Date(year,month,0).getDate();
  return {year,month,day:Math.min(day,lastDay)};
}

function formatDate(d){return `${d.year}年${d.month}月${d.day}日`;}
function formatBirthValue(value){const d=parseBirthDate(value);return d?formatDate(d):String(value||'');}
function getAgeFromBirth(value){
  const d=parseBirthDate(value);if(!d)return null;
  const now=new Date();let age=now.getFullYear()-d.year;
  if(now.getMonth()+1<d.month||(now.getMonth()+1===d.month&&now.getDate()<d.day))age--;
  return Math.max(0,age);
}

function getAutoYears(birthDate){
  const d=parseBirthDate(birthDate);
  if(!d) return [];
  const {month,day}=d;
  const now=new Date();
  const cy=now.getFullYear();
  return [calcAnnualYear(cy,month,day),calcAnnualYear(cy+1,month,day),calcAnnualYear(cy+2,month,day)];
}

function updateAutoYears(){
  const birth=document.getElementById('birthDate').value;
  const years=getAutoYears(birth);
  const display=document.getElementById('autoYearsDisplay');
  if(years.length===0||!birth){
    display.innerHTML='<strong>📅 三年年度策略：</strong><span style="color:var(--text-light);font-size:.8rem">请先选择出生日期，自动计算</span>';
    return;
  }
  const d=parseBirthDate(birth);
  const month=d.month, day=d.day;
  const nowY=new Date().getFullYear();
  let html='<strong>📅 三年年度策略：</strong>';
  for(let i=0;i<years.length;i++){
    const y=years[i];
    const s=ANNUAL_STRATEGY[y];
    const cls=s&&s.type==='expand'?'yr-expand':'yr-settle';
    const label=s?ANNUAL_NAMES[y]:'';
    const sy=nowY+i;
    const startDate=anniversaryDate(sy,month,day);
    const endDate=anniversaryDate(sy+1,month,day);
    const ds=`${formatDate(startDate)} 至 ${formatDate(endDate)}`;
    html+=`<span class="yr-badge ${cls}">${label}<br><small style="font-size:.65rem;opacity:.7">${ds}</small></span>`;
  }
  display.innerHTML=html;
}

// ==================== 分析引擎 ====================
function analyzeEnergy(talents){
  const counts={wind:0,fire:0,water:0,earth:0};
  const energyTalents={wind:[],fire:[],water:[],earth:[]};
  for(let t of talents){
    if(t.absorbedByResonance) continue;
    const d=TALENT_DETAIL[t.num]; if(!d) continue;
    const e=d.energy; counts[e]+=t.multiplier; energyTalents[e].push({...t,detail:d});
  }
  const zeros=[];
  for(let [k,c] of Object.entries(counts)){if(c===0) zeros.push(k);}
  return {counts,energyTalents,zeros};
}

function findCombos(talents,selectedCombos=[]){
  // 组合天赋必须由录入者明确选择；潜能天赋不参与，也不根据名称自动猜测。
  const talentNums=new Set(talents.map(t=>t.num));
  return selectedCombos.filter(combo=>combo&&combo.nums.every(n=>talentNums.has(n)));
}

function getEnergyRanking(talents,combos,potentialNums){
  const mains=talents.filter(t=>t.role!=='aux');
  const auxs=talents.filter(t=>t.role==='aux');
  const auxNums=new Set(auxs.map(t=>t.num));
  const resonantNums=new Set(mains.filter(t=>auxNums.has(t.num)).map(t=>t.num));
  const core=mains.filter(t=>t.multiplier>=3||resonantNums.has(t.num));
  const overlap=mains.filter(t=>t.multiplier===2&&!resonantNums.has(t.num));
  const single=mains.filter(t=>t.multiplier===1&&!resonantNums.has(t.num));
  const standaloneAux=auxs.filter(t=>!resonantNums.has(t.num));
  return {core,combos,overlap,single,aux:standaloneAux,resonantNums,potentialNums};
}

function getDirectionCareerExamples(direction,contributors){
  const keywords=CAREER_EXAMPLE_KEYWORDS[direction.id]||[];
  const candidates=[];
  for(const contributor of contributors){
    const careers=TALENT_DETAIL[contributor.num]?.careers||[];
    for(const career of careers){
      const matched=keywords.some(keyword=>career.includes(keyword));
      candidates.push({career,matched,score:contributor.value+(matched?20:0)});
    }
  }
  candidates.sort((a,b)=>b.score-a.score||Number(b.matched)-Number(a.matched));
  const result=[];
  for(const item of candidates){if(!result.includes(item.career)) result.push(item.career);if(result.length===3) break;}
  for(const fallback of direction.examples){if(result.length<3&&!result.includes(fallback))result.push(fallback);}
  return result.slice(0,3);
}

function getCareerDirections(talents,combos){
  const comboNums=new Set(combos.flatMap(c=>c.nums));
  const scored=CAREER_ARCHETYPES.map(direction=>{
    let score=0,contributors=[];
    for(const t of talents){
      if(t.absorbedByResonance) continue;
      const fit=direction.weights[t.num]||0;
      if(!fit) continue;
      const roleFactor=1;
      const comboFactor=comboNums.has(t.num)?1.12:1;
      score+=fit*(t.multiplier||1)*roleFactor*comboFactor;
      contributors.push({num:t.num,name:t.name,value:fit*(t.multiplier||1)});
    }
    contributors.sort((a,b)=>b.value-a.value);
    return {...direction,score,examples:getDirectionCareerExamples(direction,contributors),contributors:contributors.slice(0,3).map(x=>x.name)};
  }).sort((a,b)=>b.score-a.score||a.title.localeCompare(b.title,'zh-CN'));
  const selected=scored.filter(direction=>direction.score>0).slice(0,5);
  const leadingTalents=[...talents].filter(t=>t.role!=='aux'&&!t.absorbedByResonance).sort((a,b)=>b.multiplier-a.multiplier);
  const sourceNames=leadingTalents.slice(0,3).map(t=>t.name);
  const usedExamples=new Set(selected.flatMap(direction=>direction.examples));
  const evidenceCareers=leadingTalents.flatMap(t=>TALENT_DETAIL[t.num]?.careers||[]).filter(career=>{
    if(usedExamples.has(career))return false;
    usedExamples.add(career);return true;
  });
  const fallbackBlueprints=[
    {title:'核心优势的跨场景应用',core:`围绕${sourceNames.join('、')}等核心天赋，把已经具备的能力迁移到不同产业、项目或服务场景中。`},
    {title:'个人经验的专业化转化',core:`将${sourceNames.join('、')}带来的经验沉淀为作品、方法或服务，在实践中逐步形成清晰定位。`},
    {title:'多天赋协同的项目实践',core:`以${sourceNames.join('、')}为能力支点，通过真实项目验证最适合自己的工作方式与发展路径。`}
  ];
  let fallbackIndex=0;
  while(selected.length<5){
    const blueprint=fallbackBlueprints[fallbackIndex%fallbackBlueprints.length];
    const start=fallbackIndex*3;
    const examples=evidenceCareers.slice(start,start+3);
    while(examples.length<3)examples.push(...leadingTalents.flatMap(t=>TALENT_DETAIL[t.num]?.careers||[]).filter(c=>!examples.includes(c)).slice(0,3-examples.length));
    selected.push({id:`evidence_extension_${fallbackIndex}`,title:blueprint.title,core:blueprint.core,examples:examples.slice(0,3),contributors:sourceNames,score:.01,derivedFromEvidence:true});
    fallbackIndex++;
  }
  return selected.slice(0,5);
}

// ==================== 合盘 ====================
function analyzeSynastry(analysis1,analysis2){
  if(!analysis1||!analysis2) return null;
  const t1=analysis1.talents,t2=analysis2.talents;
  const mains1=t1.filter(t=>t.role!=='aux');
  const auxs1=t1.filter(t=>t.role==='aux');
  const mains2=t2.filter(t=>t.role!=='aux');
  const auxs2=t2.filter(t=>t.role==='aux');
  
  let reasons=[],score=0;
  
  // 规则1：主天赋×辅助天赋匹配
  const matchPairs=[];
  for(let m of mains1){for(let a of auxs2){if(m.num===a.num){matchPairs.push(`${escapeHtml(analysis1.name)}的${m.name}（主）↔ ${escapeHtml(analysis2.name)}的${a.name}（辅）`);score+=3;}}}
  for(let m of mains2){for(let a of auxs1){if(m.num===a.num){matchPairs.push(`${escapeHtml(analysis2.name)}的${m.name}（主）↔ ${escapeHtml(analysis1.name)}的${a.name}（辅）`);score+=3;}}}
  if(matchPairs.length>0) reasons.push({title:'主辅共振',detail:'双方的主要天赋与辅助天赋互相呼应，能自然形成互补与滋养的关系。',pairs:matchPairs});
  
  // 规则2：合并后形成组合天赋
  const allNums1=new Set(t1.map(t=>t.num)),allNums2=new Set(t2.map(t=>t.num));
  const combinedNums=new Set([...allNums1,...allNums2]);
  const comboMatch=[];
  for(let c of COMBOS){
    const completeTogether=c.nums.every(n=>combinedNums.has(n));
    const completeByFirst=c.nums.every(n=>allNums1.has(n));
    const completeBySecond=c.nums.every(n=>allNums2.has(n));
    const bothContribute=c.nums.some(n=>allNums1.has(n))&&c.nums.some(n=>allNums2.has(n));
    if(completeTogether&&!completeByFirst&&!completeBySecond&&bothContribute)comboMatch.push(c);
  }
  if(comboMatch.length>0){score+=5;reasons.push({title:'组合天赋契合',detail:'双方天赋合并后形成了完整的组合能量，在一起时能激发超越各自单独时的协同效应。',combos:comboMatch});}
  
  // 规则3：同能量类型重合
  const e1={},e2={};
  for(let t of t1){if(t.absorbedByResonance)continue;const e=TALENT_DETAIL[t.num]?.energy;if(e){if(!e1[e])e1[e]=0;e1[e]+=t.multiplier;}}
  for(let t of t2){if(t.absorbedByResonance)continue;const e=TALENT_DETAIL[t.num]?.energy;if(e){if(!e2[e])e2[e]=0;e2[e]+=t.multiplier;}}
  const sharedEnergy=[];
  for(let e of ['wind','fire','water','earth']){if((e1[e]||0)>0&&(e2[e]||0)>0) sharedEnergy.push(ENERGY_TYPES[e].name);}
  if(sharedEnergy.length>=2){score+=sharedEnergy.length;reasons.push({title:'能量共鸣',detail:`双方在${sharedEnergy.join('、')}等领域有共同的能量语言，沟通更顺畅，理解更深入。`});}
  
  let level,levelClass,desc;
  if(score>=6){level='💎 高度契合';levelClass='match-high';desc='你们的天赋组合在亲密关系和亲子协作上展现出难得的高度和谐。在情感连接上能互相深度理解与滋养，在共同养育或教育孩子时能形成天然互补——一方擅长的恰好是另一方需要支持的领域。是非常理想的伴侣或亲子协作拍档。';}
  else if(score>=3){level='🌟 良好契合';levelClass='match-mid';desc='你们之间存在明显的天赋共振点。在亲密关系中能通过特定领域的共鸣建立深度连接；在亲子协作方面也有良好的互补基础。建议在契合度高的方向上多投入，用默契消解分歧。';}
  else{level='🤝 一般契合';levelClass='match-note';desc='你们的天赋分布在不同的能量领域，各有独特优势。在亲密关系中需要更多的主动沟通来弥合理解差异，差异可以带来新鲜视角和成长空间。在亲子协作上建议多多互相倾听、发挥各自所长。';}
  
  return {level,levelClass,desc,reasons,score};
}

function escapeHtml(value){
  return String(value||'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
}

function buildAnalysis(name,birth,structured){
  if(!structured||structured.talents.length===0) return null;
  const auxNums=new Set(structured.talents.filter(t=>t.role==='aux').map(t=>t.num));
  const resonantNums=new Set(structured.talents.filter(t=>t.role!=='aux'&&auxNums.has(t.num)).map(t=>t.num));
  const talents=structured.talents.map(t=>{
    if(t.role!=='aux'&&resonantNums.has(t.num)){
      return {...t,originalMultiplier:t.multiplier,multiplier:3,resonance:true,resonancePromoted:t.multiplier<3};
    }
    if(t.role==='aux'&&resonantNums.has(t.num)) return {...t,absorbedByResonance:true,resonance:true};
    return {...t};
  });
  const combos=findCombos(talents,structured.combos);
  const energy=analyzeEnergy(talents);
  return {name,birth,talents,potentialNums:structured.potentialNums,counts:energy.counts,zeros:energy.zeros,combos,ranking:getEnergyRanking(talents,combos,structured.potentialNums),years:getAutoYears(birth)};
}

function runAnalysis(){
  const name=document.getElementById('clientName').value.trim();
  const birth=document.getElementById('birthDate').value;
  if(!name){alert('请输入客户姓名');return;}
  if(!birth){alert('请选择阳历出生年月日');return;}
  const structured=collectStructuredTalent('client');
  if(!structured) return;
  window._analysis=buildAnalysis(name,birth,structured);
  window._analysisDirty=false;
  if(window._partnerAnalysis)window._partnerAnalysisDirty=true;
  updateAnalysisFreshUI();
  switchTab('career');
}

function renderSynastryCard(a,b){
  const sy=analyzeSynastry(a,b);
  if(!sy) return '<div class="placeholder-banner"><p>无法完成合盘分析</p></div>';
  let h=`<div class="card"><div class="card-header"><div class="card-icon" style="background:#fdf8f3">🔗</div><div><div class="card-title">亲密与亲子合盘</div><div class="card-client">${escapeHtml(a.name)}（${escapeHtml(formatBirthValue(a.birth))}） &amp; ${escapeHtml(b.name)}（${escapeHtml(formatBirthValue(b.birth))}）</div></div></div><div class="match-level ${sy.levelClass}">${sy.level}<p style="font-size:.82rem;margin-top:8px;font-weight:400">综合共振参考：${sy.score}</p></div><p style="font-size:.87rem;line-height:1.8;margin-bottom:20px">${sy.desc}</p>`;
  for(const r of sy.reasons){
    h+=`<div style="margin-bottom:16px;padding:16px;background:#fdfcf9;border-radius:10px;border:1px solid #f0ece6"><h4 style="color:var(--accent);margin-bottom:8px">${r.title}</h4><p style="font-size:.84rem;line-height:1.7">${r.detail}</p>`;
    if(r.pairs) h+='<ul style="padding-left:20px;font-size:.82rem;line-height:1.8;margin-top:8px">'+r.pairs.map(p=>'<li>'+p+'</li>').join('')+'</ul>';
    if(r.combos) h+='<div style="margin-top:8px;font-size:.82rem">'+r.combos.map(c=>'<span class="tag tag-earth">'+c.name+'</span>').join(' ')+'</div>';
    h+='</div>';
  }
  h+='<div class="disclaimer">合盘用于理解互动优势与沟通方向，不用于判定关系好坏。关系质量仍取决于尊重、沟通、边界与共同投入。</div></div>';
  return h;
}

function runSynastry(){
  if(!window._analysis||window._analysisDirty){
    const mainName=document.getElementById('clientName').value.trim();
    const mainBirth=document.getElementById('birthDate').value;
    if(!mainName||!mainBirth){alert('请先完整填写客户信息');return;}
    const mainStructured=collectStructuredTalent('client');
    if(!mainStructured) return;
    window._analysis=buildAnalysis(mainName,mainBirth,mainStructured);
  }
  const pname=document.getElementById('partnerName').value.trim();
  const pbirth=document.getElementById('partnerBirth').value;
  if(!pname||!pbirth){alert('请完整填写对方姓名和出生日期');return;}
  const partnerStructured=collectStructuredTalent('partner');
  if(!partnerStructured) return;
  window._partnerAnalysis=buildAnalysis(pname,pbirth,partnerStructured);
  window._analysisDirty=false;
  window._partnerAnalysisDirty=false;
  updateAnalysisFreshUI();
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('results').innerHTML=renderSynastryCard(window._analysis,window._partnerAnalysis);
  document.getElementById('results').scrollIntoView({behavior:'smooth',block:'start'});
}

function switchTab(tab){
  document.querySelectorAll('.tab').forEach(t=>{t.classList.remove('active');});
  const tabMap={career:'天赋职业',annual:'年度策略',relations:'关系综合'};
  document.querySelectorAll('.tab').forEach(t=>{if(t.textContent.includes(tabMap[tab]))t.classList.add('active');});
  
  const results=document.getElementById('results');
  const a=window._analysis;
  if(!a){results.innerHTML='<div class="placeholder-banner"><p>请先输入天赋信息并点击「开始解读」</p></div>';return;}
  
  if(tab==='career'){results.innerHTML=renderCareerCard(a.name,a.talents,a.counts,a.zeros,a.ranking,a.combos,a.potentialNums);}
  else if(tab==='relations'){
    results.innerHTML=renderLoveCard(a.name,a.counts,a.talents,a.counts.water||0)+renderParentCard(a.name,a.talents,a.counts,a.birth)+renderMoneyCard(a.name,a.talents,a.counts);
  }
  else if(tab==='annual'){results.innerHTML=renderAnnualCard(a.years,a.birth);}
}

function toggleSynastry(){
  const p=document.getElementById('synastryPanel');
  const h2=document.querySelector('#inputPanel h2[onclick]');
  if(p.style.display==='none'){p.style.display='block';if(h2)h2.textContent='合盘分析 ▾ 点击收起';}
  else{p.style.display='none';if(h2)h2.textContent='合盘分析 ▸ 点击展开';}
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
if(typeof escapeHtml==='undefined'){var escapeHtml=esc;}

function canvasRoundRect(ctx,x,y,w,h,r,fill,stroke){
  ctx.beginPath();ctx.roundRect(x,y,w,h,r);
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();}
}

function canvasWrappedText(ctx,text,x,y,maxWidth,lineHeight,maxLines=2){
  const chars=String(text).split('');let line='',lines=[];
  for(const ch of chars){
    const test=line+ch;
    if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=ch;}else line=test;
  }
  if(line) lines.push(line);
  if(lines.length>maxLines){lines=lines.slice(0,maxLines);let last=lines[maxLines-1];while(ctx.measureText(last+'…').width>maxWidth)last=last.slice(0,-1);lines[maxLines-1]=last+'…';}
  lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lineHeight));
  return lines.length*lineHeight;
}

function canvasSectionTitle(ctx,title,x,y,color='#a33d36'){
  canvasRoundRect(ctx,x,y+2,9,29,2,'#a33d36');

function canvasInkMountains(ctx,x,y,w,h){
  ctx.save();
  ctx.globalAlpha=.07;ctx.fillStyle='#5d9675';
  ctx.beginPath();ctx.moveTo(x,y+h);
  ctx.bezierCurveTo(x+w*.12,y+h*.66,x+w*.2,y+h*.2,x+w*.32,y+h*.62);
  ctx.bezierCurveTo(x+w*.42,y+h*.94,x+w*.49,y+h*.3,x+w*.59,y+h*.57);
  ctx.bezierCurveTo(x+w*.71,y+h*.86,x+w*.78,y+h*.44,x+w,y+h*.7);
  ctx.lineTo(x+w,y+h);ctx.closePath();ctx.fill();
  ctx.globalAlpha=.05;ctx.fillStyle='#a77a37';
  ctx.beginPath();ctx.moveTo(x,y+h);ctx.bezierCurveTo(x+w*.2,y+h*.72,x+w*.34,y+h*.45,x+w*.52,y+h*.79);ctx.bezierCurveTo(x+w*.69,y+h*.98,x+w*.8,y+h*.58,x+w,y+h*.83);ctx.lineTo(x+w,y+h);ctx.closePath();ctx.fill();
  ctx.restore();
}

function canvasBrandSeal(ctx,x,y){
  canvasRoundRect(ctx,x,y,54,64,3,'#a33d36','#8f312b');
  ctx.strokeStyle='rgba(255,247,232,.72)';ctx.lineWidth=1;ctx.strokeRect(x+5,y+5,44,54);

}
